<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0b0f14"/>
<title>Providers · Use-AI Proxy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  color-scheme:dark;
  --bg:#0b0f14; --panel:#12181f; --panel2:#182029; --line:#243040; --line2:#2e3d4f;
  --text:#e8eef6; --muted:#8b9bb0; --dim:#5c6b7e;
  --accent:#3b82f6; --accent2:#2563eb; --ok:#22c55e; --warn:#eab308; --danger:#ef4444;
  --r:12px; --font:Inter,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:400 14px/1.45 var(--font)}
a{color:var(--accent);text-decoration:none}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
@media(max-width:860px){.shell{grid-template-columns:1fr}.side{display:none}.side.open{display:block}}
.side{background:#0e141b;border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:15px;margin:0 0 4px}
.brand span{color:var(--muted);font-weight:500;font-size:12px;display:block;margin-top:2px}
.nav a{display:block;padding:9px 12px;border-radius:8px;color:var(--muted);margin-bottom:4px}
.nav a.active,.nav a:hover{background:var(--panel2);color:var(--text)}
.main{padding:20px 18px 64px;max-width:980px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font-size:20px;font-weight:650}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.15)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
input[type=search],input[type=text],input[type=password],textarea,select{
  width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);
  padding:10px 12px;font:400 13px/1.4 var(--mono);outline:none}
input[type=search]{max-width:320px;font-family:var(--font)}
textarea{min-height:72px;resize:vertical}
label.lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;display:block;margin:0 0 6px}
button,.btn{
  background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 12px;font:500 12.5px var(--font);
  cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button.secondary,.btn.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
button:disabled{opacity:.5;cursor:not-allowed}
button.danger{background:transparent;border:1px solid #7f1d1d;color:#fca5a5}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;user-select:none}
.card-h:hover{background:rgba(255,255,255,.02)}
.icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0;overflow:hidden}
.icon img{width:100%;height:100%;object-fit:cover}
.meta{flex:1;min-width:0}
.meta h2{margin:0;font-size:14px;font-weight:600}
.meta p{margin:2px 0 0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.ok{color:#86efac;border-color:#166534;background:rgba(22,101,52,.25)}
.pill.no{color:#fca5a5;border-color:#7f1d1d;background:rgba(127,29,29,.2)}
.chev{color:var(--dim);transition:transform .15s}
.card.open .chev{transform:rotate(90deg)}
.body{display:none;border-top:1px solid var(--line);padding:0}
.card.open .body{display:block}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);overflow:x:auto;background:#0f151c}
.tab{padding:10px 14px;font-size:12.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.pane{display:none;padding:14px;gap:12px}
.pane.on{display:flex;flex-direction:column}
.fields{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:12px;color:var(--muted);line-height:1.4}
.model-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-size:13px}
.model-row code{font-family:var(--mono);font-size:12px;color:#93c5fd}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.login{max-width:400px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px}
.login h1{margin:0 0 8px;font-size:18px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#182029;border:1px solid var(--line2);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:90vw;font-size:13px}
.toast.show{opacity:1}
.footer{margin-top:28px;color:var(--dim);font-size:12px}
pre.out{background:#0a0e13;border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.4 var(--mono);white-space:pre-wrap;max-height:160px;overflow:auto;color:#cbd5e1}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script>
const PROVIDERS = [
  { id:'deepseek', name:'DeepSeek', color:'#4D6BFE', text:'DS', site:'https://chat.deepseek.com', models:['deepseek-chat','deepseek-reasoner'], fields:[
    {key:'DEEPSEEK_TOKEN',label:'Token',secret:true},
    {key:'DEEPSEEK_COOKIE',label:'Cookie',secret:true,area:true},
    {key:'DEEPSEEK_URL',label:'URL',placeholder:'https://chat.deepseek.com'},
  ], scraper:'deepseek', browserLogin:true },
  { id:'kimi', name:'Kimi / Moonshot', color:'#1A1A1A', text:'Ki', site:'https://www.kimi.ai', models:['kimi','kimi-k2'], fields:[
    {key:'KIMI_TOKEN',label:'Access token',secret:true,area:true},
    {key:'KIMI_REFRESH_TOKEN',label:'Refresh token',secret:true,area:true},
    {key:'KIMI_URL',label:'URL',placeholder:'https://www.kimi.ai'},
  ], scraper:'kimi', browserLogin:true },
  { id:'perplexity', name:'Perplexity Web', color:'#20808D', text:'Px', site:'https://www.perplexity.ai', models:['perplexity','pplx-auto','pplx-sonar'], fields:[
    {key:'PERPLEXITY_COOKIE',label:'Cookie (__Secure-next-auth.session-token)',secret:true,area:true},
  ], scraper:'perplexity', browserLogin:true },
  { id:'grok', name:'Grok Web', color:'#1DA1F2', text:'Gk', site:'https://grok.com', models:['grok'], fields:[
    {key:'GROK_COOKIE',label:'Cookie',secret:true,area:true},
  ], scraper:'cookie', browserLogin:true },
  { id:'uc', name:'UC / uncensored.com', color:'#7C3AED', text:'UC', site:'https://uncensored.com', models:['uc','glm-image'], fields:[
    {key:'UC_COOKIE',label:'Cookie (must include __client)',secret:true,area:true},
  ], scraper:'uc', browserLogin:true },
  { id:'mistral', name:'Mistral / Codestral', color:'#F7D046', text:'M', site:'https://console.mistral.ai', models:['codestral','mistral-small'], fields:[
    {key:'MISTRAL_API_KEY',label:'API key(s)',secret:true},
  ], scraper:'none', browserLogin:false },
  { id:'huggingface', name:'Hugging Face', color:'#FFD21E', text:'HF', site:'https://huggingface.co/chat', models:['hf'], fields:[
    {key:'HF_CHAT_COOKIE',label:'hf-chat cookie',secret:true},
  ], scraper:'hf', browserLogin:true },
  { id:'opencode', name:'OpenCode Free', color:'#E87040', text:'OC', site:'https://opencode.ai', models:['opencode'], fields:[
    {key:'OPENCODE_ENABLED',label:'Enabled (1/0)',placeholder:'1'},
  ], scraper:'none', browserLogin:false },
  { id:'notrack', name:'NoTrack', color:'#22C55E', text:'NT', site:'https://notrack.ai', models:['notrack'], fields:[{key:'NOTRACK_COOKIE',label:'Cookie',secret:true,area:true}], scraper:'cookie', browserLogin:true },
  { id:'t3', name:'t3.chat', color:'#A78BFA', text:'T3', site:'https://t3.chat', models:['t3'], fields:[{key:'T3_COOKIE',label:'Cookie',secret:true,area:true}], scraper:'cookie', browserLogin:true },
  { id:'venice', name:'Venice', color:'#0EA5E9', text:'V', site:'https://venice.ai', models:['venice'], fields:[{key:'VENICE_COOKIE',label:'Cookie',secret:true,area:true}], scraper:'cookie', browserLogin:true },
  { id:'poe', name:'Poe', color:'#5B21B6', text:'Poe', site:'https://poe.com', models:['poe'], fields:[{key:'POE_COOKIE',label:'Cookie p-b',secret:true,area:true}], scraper:'poe', browserLogin:true },
  { id:'pollinations', name:'Pollinations', color:'#F59E0B', text:'Po', site:'https://pollinations.ai', models:['pollinations'], fields:[{key:'POLLINATIONS_KEY',label:'Optional key',secret:true}], scraper:'none', browserLogin:false },
  { id:'zai', name:'Z.ai', color:'#8B5CF6', text:'Z', site:'https://chat.z.ai', models:['zai'], fields:[{key:'ZAI_COOKIE',label:'Cookie',secret:true,area:true},{key:'ZAI_TOKEN',label:'Token',secret:true}], scraper:'zai', browserLogin:true },
  { id:'syntx', name:'SYNTX', color:'#B45309', text:'SX', site:'https://syntx.ai', models:['syntx'], fields:[{key:'SYNTX_TOKEN',label:'Bearer JWT',secret:true,area:true}], scraper:'bearer', browserLogin:true },
  { id:'twinmind', name:'Twinmind', color:'#1D4ED8', text:'TM', site:'https://app.twinmind.com', models:['twinmind'], fields:[{key:'TWINMIND_TOKEN',label:'Firebase JWT',secret:true,area:true}], scraper:'bearer', browserLogin:true },
  { id:'hyperagent', name:'HyperAgent', color:'#0F766E', text:'HA', site:'https://hyperagent.com', models:['hyperagent'], fields:[{key:'HYPERAGENT_COOKIE',label:'Cookie',secret:true,area:true}], scraper:'cookie', browserLogin:true },
  { id:'conol', name:'Conol', color:'#BE185D', text:'Co', site:'https://conol.ai', models:['conol'], fields:[{key:'CONOL_COOKIE',label:'Cookie',secret:true,area:true}], scraper:'cookie', browserLogin:true },
];

const SCRIPTS = {
  deepseek:`(()=>{const token=localStorage.getItem('userToken')||localStorage.getItem('token')||'';const out={DEEPSEEK_URL:location.origin,DEEPSEEK_TOKEN:String(token).replace(/^Bearer\\s+/i,''),DEEPSEEK_COOKIE:document.cookie||''};console.log(out);copy(JSON.stringify(out,null,2));return out})()`,
  kimi:`(()=>{let a='',r='';for(const s of[localStorage,sessionStorage]){for(const k of Object.keys(s)){const v=s.getItem(k)||'';if(/access/i.test(k)&&v.startsWith('eyJ'))a=v;if(/refresh/i.test(k)&&v.startsWith('eyJ'))r=v}}const out={KIMI_URL:location.href.includes('kimi.ai')?'https://www.kimi.ai':'https://www.kimi.com',KIMI_TOKEN:a,KIMI_REFRESH_TOKEN:r};copy(JSON.stringify(out,null,2));console.log(out);return out})()`,
  perplexity:`(()=>{console.log('%cCopy __Secure-next-auth.session-token from Application → Cookies (HttpOnly)','color:#eab308');copy('__Secure-next-auth.session-token=');})()`,
  cookie:`(()=>{copy(document.cookie||'');console.log('Copied document.cookie — HttpOnly missing')})()`,
  uc:`(()=>{copy(document.cookie||'');console.log('Ensure __client from Application → Cookies')})()`,
  hf:`(()=>{const h=(document.cookie||'').split(';').map(s=>s.trim()).find(s=>s.startsWith('hf-chat='));copy(h?h.split('=').slice(1).join('='):document.cookie)})()`,
  poe:`(()=>{const p=(document.cookie||'').split(';').map(s=>s.trim()).find(s=>s.startsWith('p-b='));copy(p||document.cookie)})()`,
  zai:`(()=>{let t=localStorage.getItem('token')||'';const out={ZAI_TOKEN:t,ZAI_COOKIE:document.cookie||''};copy(JSON.stringify(out,null,2))})()`,
  bearer:`(()=>{const f=Object.entries(localStorage).find(([,v])=>String(v).startsWith('eyJ'));if(f)copy(String(f[1]));else console.log('Copy Bearer from Network tab')})()`,
  none:`(()=>{console.log('Use API key from provider dashboard')})()`,
};

let token = sessionStorage.getItem('admin_token') || '';
let statusMap = {};
let iconsMap = {};
let health = {};
let browserInfo = { available: false };
let openId = null;
let tabMap = {};
let connMap = {};
let filter = '';

function toast(msg, ok) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderColor = ok === false ? 'var(--danger)' : 'var(--line2)';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3500);
}
async function api(path, opts = {}) {
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (token) headers.Authorization = 'Bearer ' + token;
  const r = await fetch(path, { ...opts, headers });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); } catch {
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
}
function configured(p) {
  return (p.fields || []).some(f => statusMap[f.key] && statusMap[f.key].configured);
}
function iconHtml(p) {
  if (iconsMap[p.id]) return `<img src="${iconsMap[p.id]}" alt=""/>`;
  return p.text;
}

function renderLogin() {
  document.getElementById('root').innerHTML = `
  <div class="login">
    <h1>Admin login</h1>
    <p class="sub">Uses ADMIN_PASSWORD from Render env / Redis</p>
    <label class="lbl">Password</label>
    <input id="pw" type="password" placeholder="ADMIN_PASSWORD"/>
    <div class="row" style="margin-top:12px"><button id="go">Sign in</button></div>
  </div>`;
  document.getElementById('go').onclick = async () => {
    token = document.getElementById('pw').value.trim();
    sessionStorage.setItem('admin_token', token);
    try { await api('/api/admin/status'); render(); }
    catch (e) { token = ''; sessionStorage.removeItem('admin_token'); toast(e.message, false); }
  };
}

function fieldHtml(f) {
  const st = statusMap[f.key] || {};
  const ph = st.configured ? (st.preview || '•••• configured') : (f.placeholder || '');
  if (f.area) return `<div><label class="lbl">${f.label} · <code>${f.key}</code></label><textarea data-key="${f.key}" placeholder="${ph}"></textarea></div>`;
  return `<div><label class="lbl">${f.label} · <code>${f.key}</code></label><input data-key="${f.key}" type="${f.secret?'password':'text'}" placeholder="${ph}" autocomplete="off"/></div>`;
}

function modelsHtml(p) {
  const c = connMap[p.id] || { customModels: [] };
  const all = [...(p.models || []), ...(c.customModels || [])];
  const rows = all.map(m => `<div class="model-row"><code>${m}</code><button class="ghost" data-rm-model="${p.id}" data-model="${m}" ${p.models.includes(m)?'disabled title="built-in"':''}>Remove</button></div>`).join('') || '<div class="hint">No models listed</div>';
  return `${rows}
    <div class="row">
      <input id="addm-${p.id}" type="text" placeholder="custom-model-id" style="flex:1;min-width:140px"/>
      <button class="secondary" data-add-model="${p.id}">+ Add model</button>
    </div>
    <label class="switch"><input type="checkbox" data-rr="${p.id}" ${c.roundRobin?'checked':''}/> Round-robin across keys / accounts when multiple values are set</label>`;
}

function thinkingHtml(p) {
  const t = (connMap[p.id] || {}).thinking || {};
  return `
    <label class="switch"><input type="checkbox" data-th-en="${p.id}" ${t.enabled?'checked':''}/> Enable thinking / reasoning preference for this provider</label>
    <div><label class="lbl">Thinking budget (tokens, 0 = provider default)</label>
    <input type="text" data-th-bud="${p.id}" value="${t.budget||0}"/></div>
    <p class="hint">Applied when the upstream supports reasoning controls. Otherwise stored for future routing.</p>`;
}

function card(p) {
  const on = configured(p);
  const open = openId === p.id;
  const tab = tabMap[p.id] || 'creds';
  return `<article class="card ${open?'open':''}" data-id="${p.id}">
    <div class="card-h" data-toggle="${p.id}">
      <div class="icon" style="background:${p.color}">${iconHtml(p)}</div>
      <div class="meta"><h2>${p.name}</h2><p>${String(p.site||'').replace('https://','').replace('http://','')} · ${(p.models||[]).slice(0,3).join(', ')}</p></div>
      <span class="pill ${on?'ok':'no'}">${on?'connected':'not set'}</span>
      <span class="chev">▸</span>
    </div>
    <div class="body">
      <div class="tabs">
        <div class="tab ${tab==='creds'?'on':''}" data-tab="${p.id}" data-t="creds">Credentials</div>
        <div class="tab ${tab==='browser'?'on':''}" data-tab="${p.id}" data-t="browser">Login via browser</div>
        <div class="tab ${tab==='models'?'on':''}" data-tab="${p.id}" data-t="models">Models</div>
        <div class="tab ${tab==='thinking'?'on':''}" data-tab="${p.id}" data-t="thinking">Thinking</div>
        <div class="tab ${tab==='test'?'on':''}" data-tab="${p.id}" data-t="test">Test</div>
      </div>
      <div class="pane ${tab==='creds'?'on':''}">
        <div class="fields">${(p.fields||[]).map(fieldHtml).join('')}</div>
        <div class="row">
          <button data-save="${p.id}">Save values</button>
          <button class="secondary" data-console="${p.id}">Copy console JS</button>
        </div>
        <p class="hint">Paste secrets here. With Upstash Redis configured, values survive Render redeploys.</p>
      </div>
      <div class="pane ${tab==='browser'?'on':''}">
        <p class="hint"><b>Login via browser</b> (9router-style) runs a real browser on the <i>server</i>, opens ${p.site}, and captures session cookies/tokens after you log in.</p>
        <p class="hint">${browserInfo.available
          ? 'Browser worker is available on this host.'
          : 'Not available on this deploy (no Chromium / BROWSER_WORKER_URL). Use manual paste or console scraper on Render free.'}</p>
        <div class="row">
          <button ${browserInfo.available && p.browserLogin ? '' : 'disabled'} data-browser="${p.id}">Start browser login</button>
          <a class="btn secondary" href="${p.site}" target="_blank" rel="noopener">Open site ↗</a>
          <button class="secondary" data-console="${p.id}">Copy console JS</button>
        </div>
        <pre class="out" id="blog-${p.id}">Status: idle</pre>
      </div>
      <div class="pane ${tab==='models'?'on':''}">
        ${modelsHtml(p)}
        <div class="row"><button class="secondary" data-save-conn="${p.id}">Save model settings</button></div>
      </div>
      <div class="pane ${tab==='thinking'?'on':''}">
        ${thinkingHtml(p)}
        <div class="row"><button class="secondary" data-save-conn="${p.id}">Save thinking</button></div>
      </div>
      <div class="pane ${tab==='test'?'on':''}">
        <p class="hint">Sends a tiny chat completions request through this proxy for model <code>${(p.models&&p.models[0])||p.id}</code>.</p>
        <div class="row"><button data-test="${p.id}">Test connection</button></div>
        <pre class="out" id="tout-${p.id}">—</pre>
      </div>
    </div>
  </article>`;
}

async function loadAll() {
  statusMap = await api('/api/admin/status');
  health = await fetch('/health').then(r => r.json()).catch(() => ({}));
  try {
    const cat = await fetch('/api/providers-catalog').then(r => r.json());
    iconsMap = cat.icons || {};
  } catch {}
  try { browserInfo = await fetch('/api/browser-login/status').then(r => r.json()); } catch { browserInfo = { available: false }; }
  try { connMap = await api('/api/admin/connections'); } catch { connMap = {}; }
}

function wire() {
  document.querySelectorAll('[data-toggle]').forEach(el => {
    el.onclick = () => {
      const id = el.getAttribute('data-toggle');
      openId = openId === id ? null : id;
      renderDash(false);
    };
  });
  document.querySelectorAll('[data-tab]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = el.getAttribute('data-tab');
      tabMap[id] = el.getAttribute('data-t');
      openId = id;
      renderDash(false);
    };
  });
  document.querySelectorAll('[data-save]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.getAttribute('data-save');
      const card = btn.closest('.card');
      const body = {};
      card.querySelectorAll('[data-key]').forEach(inp => {
        const v = inp.value.trim();
        if (v) body[inp.getAttribute('data-key')] = v;
      });
      if (!Object.keys(body).length) return toast('Nothing to save', false);
      btn.disabled = true;
      try {
        statusMap = await api('/api/admin/config', { method: 'POST', body: JSON.stringify(body) });
        toast('Saved' + (statusMap._meta && statusMap._meta.savedToRedis ? ' · Redis' : ''), true);
        await renderDash(true);
      } catch (e) { toast(e.message, false); }
      btn.disabled = false;
    };
  });
  document.querySelectorAll('[data-console]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.getAttribute('data-console');
      const p = PROVIDERS.find(x => x.id === id);
      const script = SCRIPTS[p.scraper] || SCRIPTS.cookie;
      await copyText(`// ${p.name} · paste on ${p.site} console\n` + script);
      toast('Console JS copied — open site → F12 → paste', true);
    };
  });
  document.querySelectorAll('[data-browser]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.getAttribute('data-browser');
      const out = document.getElementById('blog-' + id);
      out.textContent = 'Starting…';
      try {
        const j = await api('/api/browser-login/start', { method: 'POST', body: JSON.stringify({ provider: id }) });
        out.textContent = JSON.stringify(j, null, 2);
        toast(j.message || 'Browser login', j.ok !== false);
      } catch (e) {
        out.textContent = e.message;
        toast(e.message, false);
      }
    };
  });
  document.querySelectorAll('[data-test]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.getAttribute('data-test');
      const p = PROVIDERS.find(x => x.id === id);
      const out = document.getElementById('tout-' + id);
      out.textContent = 'Testing…';
      try {
        const j = await api('/api/admin/test', { method: 'POST', body: JSON.stringify({ provider: id, model: (p.models || [id])[0] }) });
        out.textContent = JSON.stringify(j, null, 2);
        toast(j.ok ? 'Test OK' : (j.error || 'Failed'), !!j.ok);
      } catch (e) {
        out.textContent = e.message;
        toast(e.message, false);
      }
    };
  });
  document.querySelectorAll('[data-save-conn]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.getAttribute('data-save-conn');
      const card = btn.closest('.card');
      const rr = card.querySelector(`[data-rr="${id}"]`);
      const en = card.querySelector(`[data-th-en="${id}"]`);
      const bud = card.querySelector(`[data-th-bud="${id}"]`);
      const prev = connMap[id] || { customModels: [] };
      const patch = {
        roundRobin: !!(rr && rr.checked),
        thinking: { enabled: !!(en && en.checked), budget: Number((bud && bud.value) || 0) || 0 },
        customModels: prev.customModels || [],
      };
      try {
        connMap = await api('/api/admin/connections', { method: 'POST', body: JSON.stringify({ id, ...patch }) });
        toast('Connection settings saved', true);
      } catch (e) { toast(e.message, false); }
    };
  });
  document.querySelectorAll('[data-add-model]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.getAttribute('data-add-model');
      const inp = document.getElementById('addm-' + id);
      const m = (inp && inp.value || '').trim();
      if (!m) return;
      const prev = connMap[id] || { customModels: [] };
      const customModels = Array.from(new Set([...(prev.customModels || []), m]));
      try {
        const all = await api('/api/admin/connections', { method: 'POST', body: JSON.stringify({ id, customModels }) });
        connMap = all;
        openId = id; tabMap[id] = 'models';
        renderDash(false);
        toast('Model added', true);
      } catch (e) { toast(e.message, false); }
    };
  });
  document.querySelectorAll('[data-rm-model]').forEach(btn => {
    if (btn.disabled) return;
    btn.onclick = async () => {
      const id = btn.getAttribute('data-rm-model');
      const m = btn.getAttribute('data-model');
      const prev = connMap[id] || { customModels: [] };
      const customModels = (prev.customModels || []).filter(x => x !== m);
      connMap = await api('/api/admin/connections', { method: 'POST', body: JSON.stringify({ id, customModels }) });
      openId = id; tabMap[id] = 'models';
      renderDash(false);
    };
  });
  const lo = document.getElementById('logout');
  if (lo) lo.onclick = () => { token = ''; sessionStorage.removeItem('admin_token'); render(); };
  const sf = document.getElementById('search');
  if (sf) sf.oninput = () => { filter = sf.value.trim().toLowerCase(); renderDash(false); };
}

async function renderDash(reload) {
  if (reload !== false) await loadAll();
  const list = PROVIDERS.filter(p => !filter || p.name.toLowerCase().includes(filter) || p.id.includes(filter));
  document.getElementById('root').innerHTML = `
  <div class="shell">
    <aside class="side">
      <div class="brand">Use-AI Proxy<span>OpenAI-compatible gateway</span></div>
      <nav class="nav" style="margin-top:18px">
        <a class="active" href="/admin">Providers</a>
        <a href="/providers">Icons</a>
        <a href="/v1/models">Models JSON</a>
        <a href="/health">Health</a>
      </nav>
    </aside>
    <main class="main">
      <div class="top">
        <div>
          <h1>Provider connections</h1>
          <div class="sub">9router-style panels · credentials · browser login · models · thinking · test</div>
        </div>
        <div class="row">
          <span class="badge"><span class="dot ${health.ok?'on':''}"></span> API</span>
          <span class="badge"><span class="dot ${health.redis?'on':''}"></span> Redis</span>
          <span class="badge"><span class="dot ${browserInfo.available?'on':''}"></span> Browser</span>
          <button class="secondary" id="logout">Logout</button>
        </div>
      </div>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Filter providers…" value="${filter.replace(/"/g,'&quot;')}"/>
      </div>
      <div class="list">${list.map(card).join('')}</div>
      <p class="footer">Login via browser needs Chromium or BROWSER_WORKER_URL. On Render free, use Save values + console JS. Secrets persist via Upstash when configured.</p>
    </main>
  </div>`;
  wire();
}

function render() {
  try {
    if (!token) renderLogin();
    else renderDash(true).catch(e => {
      console.error(e);
      toast(e.message || String(e), false);
      renderLogin();
    });
  } catch (e) {
    console.error(e);
    document.getElementById('root').innerHTML = '<div class="login"><h1>Admin</h1><p class="sub">' + (e.message||e) + '</p></div>';
  }
}
render();
</script>
</body>
</html>
