<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#07090d"/>
<title>Use-AI Proxy · Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  color-scheme:dark;
  --bg:#07090d; --bg2:#0c1017; --panel:#121722; --panel2:#181e2a; --line:#243044;
  --text:#eef3fb; --muted:#8b98ad; --accent:#5b8cff; --accent2:#7c5cff; --orange:#ff6b45;
  --ok:#34d399; --danger:#f87171; --glow:rgba(91,140,255,.25);
  --font:Inter,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace; --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:400 14px/1.45 var(--font)}
body{background:
  radial-gradient(1200px 600px at 10% -10%, rgba(91,140,255,.12), transparent 55%),
  radial-gradient(900px 500px at 100% 0%, rgba(124,92,255,.10), transparent 50%),
  var(--bg)}
a{color:var(--accent);text-decoration:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.anim{animation:fadeUp .45s cubic-bezier(.22,1,.36,1) both}
.anim-d1{animation-delay:.04s}.anim-d2{animation-delay:.08s}.anim-d3{animation-delay:.12s}
.stagger > *{animation:fadeUp .4s cubic-bezier(.22,1,.36,1) both}
.stagger > *:nth-child(1){animation-delay:.02s}.stagger > *:nth-child(2){animation-delay:.05s}
.stagger > *:nth-child(3){animation-delay:.08s}.stagger > *:nth-child(4){animation-delay:.11s}
.stagger > *:nth-child(5){animation-delay:.14s}.stagger > *:nth-child(6){animation-delay:.17s}
.stagger > *:nth-child(n+7){animation-delay:.2s}

.wrap{max-width:560px;margin:0 auto;padding:12px 14px 28px}
/* Mobile: nav lives in top-left menu (not a full bar) */
.nav{display:none!important}
.nav .brand{display:none}
.menu-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);
  color:var(--text);display:grid;place-items:center;cursor:pointer;flex-shrink:0;padding:0}
.menu-btn:active{transform:scale(.96)}
.menu-btn svg{width:20px;height:20px}
.nav-drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:40;animation:fadeIn .2s}
.nav-drawer{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);z-index:41;
  background:rgba(12,16,23,.98);border-right:1px solid var(--line);padding:18px 14px;
  display:flex;flex-direction:column;gap:4px;animation:fadeUp .3s cubic-bezier(.22,1,.36,1);
  box-shadow:12px 0 40px rgba(0,0,0,.4)}
.nav-drawer .drawer-head{padding:4px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.nav-drawer .drawer-head strong{display:block;font-size:15px;font-weight:800;letter-spacing:-.02em}
.nav-drawer .drawer-head span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.nav-drawer button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:transparent;border:0;color:var(--muted);font:600 14px var(--font);
  padding:13px 12px;border-radius:12px;cursor:pointer}
.nav-drawer button.on{color:var(--text);background:rgba(91,140,255,.14)}
.nav-drawer .nav-ico{display:flex;width:22px;justify-content:center}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0}
.topbar-left .titles{min-width:0}
.proxy-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.proxy-stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.proxy-stat b{display:block;font-size:20px;font-weight:800;letter-spacing:-.03em}
.proxy-stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.proxy-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.proxy-row code{font-size:11px;word-break:break-all}
.proxy-actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ta-proxy{width:100%;min-height:120px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px;font:12px/1.4 var(--mono);resize:vertical}

.section-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.section-label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.list-item{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;cursor:pointer;transition:border-color .2s,transform .2s,box-shadow .2s}
.list-item:hover{border-color:#3d4f6a;transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.25)}
.icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-weight:800;color:#fff;overflow:hidden;flex-shrink:0;background:linear-gradient(145deg,#1a2233,#121820);box-shadow:0 4px 14px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06)}
.icon img{width:100%;height:100%;object-fit:contain;padding:6px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02))}
.icon img[src^="data:image/svg"]{padding:0;object-fit:cover;background:transparent}
.list-item .icon{width:48px;height:48px}
.hdr .icon{width:56px;height:56px;border-radius:16px}
.icon-card .box{background:linear-gradient(160deg,#141a24,#0e131b)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.icon-card .box img{object-fit:contain;padding:10px}
.icon-card .box img[src^="data:image/svg"]{padding:0;object-fit:cover}
.pill{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.ok{color:#6ee7b7;border-color:#065f46;background:rgba(6,95,70,.25)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.search{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px 14px;font:400 13px var(--font);outline:none;transition:border .2s,box-shadow .2s}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.btn{border:0;border-radius:12px;padding:11px 14px;font:600 13px var(--font);cursor:pointer;transition:transform .15s,opacity .15s,background .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--orange),#ff8f6b);color:#fff}
.btn.blue{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.block{width:100%}
.btn.danger{background:transparent;border:1px solid #7f1d1d;color:#fca5a5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;animation:fadeUp .4s both}
.card h2{margin:0 0 12px;font-size:15px;font-weight:650}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin-bottom:14px;background:none;border:0;cursor:pointer}
.hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.hdr h1{margin:0;font-size:22px;font-weight:750;letter-spacing:-.02em}
.hdr .sub{color:var(--muted);font-size:13px;margin-top:3px}
.info{background:linear-gradient(135deg,rgba(91,140,255,.12),rgba(124,92,255,.08));border:1px solid rgba(91,140,255,.25);border-radius:var(--r);padding:14px;margin-bottom:14px;color:#c5d4ef;font-size:13px;line-height:1.5}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted);font-size:13px}
.switch{position:relative;width:44px;height:26px;background:#2a3344;border-radius:999px;cursor:pointer;border:0}
.switch.on{background:var(--accent)}
.switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.18s}
.switch.on i{left:21px}
label.lbl{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:11px 12px;font:400 13px/1.4 var(--mono);outline:none;transition:border .2s,box-shadow .2s}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
textarea{min-height:88px;resize:vertical}
.conn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;animation:scaleIn .3s both}
.conn code{font-family:var(--mono);font-size:11px;color:#93c5fd;word-break:break-all}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;z-index:40;padding:12px;animation:fadeIn .2s}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 14px 14px;width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:18px;animation:scaleIn .28s cubic-bezier(.22,1,.36,1)}
.modal h3{margin:0 0 12px;font-size:17px;font-weight:700}
.modal .x{float:right;background:none;border:0;color:var(--muted);cursor:pointer}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);display:grid;place-items:center;cursor:pointer;transition:.2s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-actions{display:flex;gap:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);background:#151b27;border:1px solid var(--line);padding:11px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:50;font-size:13px;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.login{max-width:400px;margin:14vh auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;animation:scaleIn .35s}
.provider-grid{display:flex;flex-direction:column}
.model-chip{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.model-pick{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--panel2)}
.model-pick input{width:auto}
.empty{text-align:center;padding:22px 8px;color:var(--muted)}
.seg{display:inline-flex;background:var(--panel2);border-radius:999px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:999px;font:600 12px var(--font);cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.icon-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;transition:.2s}
.icon-card:hover{border-color:#3d4f6a;transform:translateY(-2px)}
.icon-card .box{width:64px;height:64px;margin:0 auto 8px;border-radius:14px;overflow:hidden;display:grid;place-items:center;background:#0e131b;border:1px solid var(--line)}
.icon-card .box img{width:100%;height:100%;object-fit:cover}

@media(min-width:900px){
  body.is-admin{padding-left:260px}
  body.is-admin .nav{display:flex!important;position:fixed;left:0;top:0;bottom:0;width:260px;flex-direction:column;justify-content:flex-start;align-items:stretch;
    overflow:auto;border-bottom:0;border-right:1px solid var(--line);padding:22px 16px;gap:6px;background:rgba(8,11,16,.95)}
  .nav .brand{display:block;padding:6px 10px 20px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .nav .brand strong{display:block;font-size:16px;font-weight:800;letter-spacing:-.03em}
  .nav .brand span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
  .nav button{flex:0;display:flex;align-items:center;gap:10px;text-align:left;padding:12px 12px;font-size:13px;border-radius:12px;border:0;background:transparent;color:var(--muted);cursor:pointer}
  .nav button.on{color:var(--text);background:rgba(91,140,255,.14);border:0}
  .nav-ico{display:flex;margin:0}
  .menu-btn{display:none!important} /* desktop uses sidebar */
  .nav-drawer-bg,.nav-drawer{display:none!important}
  .wrap{max-width:1120px;padding:32px 36px 56px}
  .provider-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .list-item{margin:0}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .span-2{grid-column:1/-1}
  .modal-bg{align-items:center}
  .modal{border-radius:18px;max-width:560px}
  .toast{bottom:28px}
}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<nav class="nav" id="nav" style="display:none">
  <div class="brand"><strong>Use-AI Proxy</strong><span>Modern OpenAI gateway</span></div>
  <button data-nav="providers" class="on"><span class="nav-ico" data-ico="providers"></span>Chat</button>
  <button data-nav="image"><span class="nav-ico" data-ico="media"></span>Image</button>
  <button data-nav="video"><span class="nav-ico" data-ico="media"></span>Video</button>
  <button data-nav="search"><span class="nav-ico" data-ico="providers"></span>Search</button>
  <button data-nav="audio"><span class="nav-ico" data-ico="media"></span>Audio</button>
  <button data-nav="custom"><span class="nav-ico" data-ico="custom"></span>Custom</button>
  <button data-nav="icons"><span class="nav-ico" data-ico="icons"></span>Icons</button>
</nav>
<script>
const ICO = {
  providers:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>`,
  media:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3V9z"/></svg>`,
  icons:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>`,
  custom:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9c.3.6.9 1 1.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>`,
  copy:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>`,
  import:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M4 19h16"/></svg>`,
  back:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>`,
  plus:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>`,
  close:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>`,
  trash:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2m-1 0v14a2 2 0 01-2 2H9a2 2 0 01-2-2V6"/></svg>`,
  key:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>`,
  check:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>`,
  refresh:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-2.1-5.7"/><path d="M21 3v6h-6"/></svg>`,
};
const SCRIPTS = {
  deepseek:`(()=>{const token=localStorage.getItem('userToken')||localStorage.getItem('token')||'';const out={DEEPSEEK_TOKEN:String(token).replace(/^Bearer\\s+/i,''),DEEPSEEK_COOKIE:document.cookie||'',DEEPSEEK_URL:location.origin};copy(JSON.stringify(out,null,2));console.log(out)})()`,
  kimi:`(()=>{let a='',r='';for(const s of[localStorage,sessionStorage]){for(const k of Object.keys(s)){const v=s.getItem(k)||'';if(/access/i.test(k)&&v.startsWith('eyJ'))a=v;if(/refresh/i.test(k)&&v.startsWith('eyJ'))r=v}}const out={KIMI_TOKEN:a,KIMI_REFRESH_TOKEN:r,KIMI_URL:location.href.includes('kimi.ai')?'https://www.kimi.ai':'https://www.kimi.com'};copy(JSON.stringify(out,null,2));console.log(out)})()`,
  cookie:`(()=>{copy(document.cookie||'');console.log('Copied document.cookie')})()`,
  none:`(()=>{console.log('Use API key from provider dashboard')})()`,
};
const SCRAPER_KIND = {deepseek:'deepseek',kimi:'kimi'};

let PROVIDERS=[], token=sessionStorage.getItem('admin_token')||'';
let statusMap={}, iconsMap={}, connMap={}, customEndpoints=[];
let view={tab:'providers', page:'list', id:null};
let modal=null, filter='', importModelsOpen=false, importModelsState={loading:false,items:[],selected:new Set()};

function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3200)}
async function api(path,opts={}){const headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});if(token)headers.Authorization='Bearer '+token;const r=await fetch(path,{...opts,headers});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.statusText);return j}
async function copyText(t){try{await navigator.clipboard.writeText(t)}catch{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}}
async function deleteProvider(id, name){
  if(!confirm('Hide provider "'+(name||id)+'" from admin? You can restore it later from Hidden providers.')) return;
  try{
    await api('/api/admin/providers/hide',{method:'POST',body:JSON.stringify({id})});
    toast('Provider hidden');
    view.page='list'; view.id=null;
    PROVIDERS = await fetch('/admin-providers.json').then(r=>r.json());
    render();
  }catch(e){toast(e.message||String(e))}
}
async function restoreProvider(id){
  try{
    await api('/api/admin/providers/unhide',{method:'POST',body:JSON.stringify({id})});
    toast('Provider restored');
    PROVIDERS = await fetch('/admin-providers.json').then(r=>r.json());
    render();
  }catch(e){toast(e.message||String(e))}
}
function paintNav(){document.querySelectorAll('[data-ico]').forEach(el=>{const k=el.getAttribute('data-ico');if(ICO[k])el.innerHTML=ICO[k]})}
const NAV_ITEMS=[
  {id:'providers',label:'Chat',ico:'providers'},
  {id:'image',label:'Image',ico:'media'},
  {id:'video',label:'Video',ico:'media'},
  {id:'search',label:'Search',ico:'providers'},
  {id:'audio',label:'Audio',ico:'media'},
  {id:'custom',label:'Custom',ico:'custom'},
  {id:'icons',label:'Icons',ico:'icons'},
  {id:'proxies',label:'Proxies',ico:'providers'},

function icon(p){const src=iconsMap[p.id];if(src)return `<img src="${src}" alt="" loading="lazy" referrerpolicy="no-referrer" data-pid="${p.id}" onerror="window.__iconErr&&window.__iconErr(this)"/>`;return `<span>${p.text||p.id.slice(0,2).toUpperCase()}</span>`}
window.__iconErr=async function(img){try{
  const pid=img.dataset.pid;
  if(!img.dataset.cand){
    const j=await fetch('/api/icons/candidates/'+encodeURIComponent(pid)).then(r=>r.json()).catch(()=>({candidates:[]}));
    img.dataset.cand=JSON.stringify((j&&j.candidates)||[]);
    img.dataset.ci='0';
  }
  const list=JSON.parse(img.dataset.cand||'[]');
  let i=parseInt(img.dataset.ci||'0',10)+1;
  while(i<list.length){
    const u=list[i++];
    if(u && u!==img.src){ img.dataset.ci=String(i-1); img.src=u; return; }
  }
  // final: hide image, show monogram text via parent
  img.style.display='none';
  const parent=img.parentElement;
  if(parent && !parent.querySelector('.mono')){
    const s=document.createElement('span'); s.className='mono';
    s.textContent=(pid||'?').slice(0,2).toUpperCase();
    parent.appendChild(s);
  }
}catch{img.style.display='none'}};

function accountFields(p){
  if(p.fields && p.fields.length) return p.fields;
  if(p.auth==='apikey' && p.envKey) return [{key:p.envKey,label:'API key',area:true}];
  return [{key:'VALUE',label:'Credential',area:true}];
}
function accountsOf(p){const c=connMap[p.id]||{};return Array.isArray(c.accounts)?c.accounts:[]}
function configured(p){
  if(accountsOf(p).length) return true;
  return accountFields(p).some(f=>statusMap[f.key]?.configured);
}
function groupOf(p){
  if(p.kind==='media') return 'media';
  if(p.group==='free' && p.auth==='apikey') return 'api-free';
  if(p.group==='free') return 'free-other';
  if(p.auth==='apikey') return 'apikey';
  return 'web';
}

async function load(){
  statusMap=await api('/api/admin/status');

  iconsMap=cat.icons||{};
  if(!PROVIDERS.length) PROVIDERS=await fetch('/admin-providers.json').then(r=>r.json());
  try{connMap=await api('/api/admin/connections')}catch{connMap={}}
  try{
    const raw=statusMap.CUSTOM_ENDPOINTS?.preview;
    // load from config status keys if present
  }catch{}
  try{
    const st=await api('/api/admin/status');
    // custom endpoints stored in PROVIDER_CONNECTIONS.__custom or env via connections
    customEndpoints = (connMap.__custom_endpoints && connMap.__custom_endpoints.list) || [];
  }catch{customEndpoints=[]}
}
async function saveConn(id,patch){
  const prev=connMap[id]||{};
  connMap=await api('/api/admin/connections',{method:'POST',body:JSON.stringify({id,...prev,...patch})});
  return connMap;
}

/** Persist account values into env keys (merged multi-account for apikey) */
async function persistAccounts(p, accounts){
  await saveConn(p.id,{accounts, roundRobin:!!(connMap[p.id]&&connMap[p.id].roundRobin)});
  const fields=accountFields(p);
  const body={};
  if(p.auth==='apikey' && p.id!=='kiro'){
    const primary=fields[0];
    if(primary){
      body[primary.key]=accounts.map(a=>{
        const v=(a.values&&a.values[primary.key])||a.key||'';
        return a.name?`${a.name}|${v}`:v;
      }).filter(Boolean).join('\n');
    }
  } else {
    const active=accounts[0];
    if(active && active.values){
      for(const [k,val] of Object.entries(active.values)){ if(val!=null && val!=='') body[k]=val; }
    }
  }
  if(Object.keys(body).length){
    statusMap=await api('/api/admin/config',{method:'POST',body:JSON.stringify(body)});
  }
}

function listSections(){
  const kindTab=view.tab;
  let list=PROVIDERS.filter(p=>{
    if(kindTab==='media') return p.kind==='media'||p.kind==='image'||p.kind==='video';
    if(kindTab==='image') return p.kind==='image';
    if(kindTab==='video') return p.kind==='video';
    if(kindTab==='search') return p.kind==='search'||p.kind==='tools';
    if(kindTab==='audio') return p.kind==='audio';
    if(kindTab==='tools') return p.kind==='tools';
    if(kindTab==='providers'||kindTab==='chat') return p.kind==='chat' || !p.kind;
    return true;
  }).filter(p=>!filter||p.name.toLowerCase().includes(filter)||p.id.includes(filter));

  const sections=[];
  if(kindTab==='providers' || kindTab==='chat'){
    const web=list.filter(p=>groupOf(p)==='web' || p.auth==='cookie' || p.auth==='session');
    const api=list.filter(p=>p.auth==='apikey' || groupOf(p)==='apikey' || groupOf(p)==='api-free');
    const rest=list.filter(p=>!web.includes(p) && !api.includes(p));
    sections.push({title:'Chat · Web session', items:web});
    sections.push({title:'Chat · API keys', items:api});
    sections.push({title:'Chat · Other', items:rest});
  } else if(kindTab==='image'){
    sections.push({title:'Image generation', items:list});
  } else if(kindTab==='video'){
    sections.push({title:'Video generation', items:list});
  } else if(kindTab==='search'){
    sections.push({title:'Web search', items:list.filter(p=>p.kind==='search' && /search|searx|tavily|brave|serper|exa/i.test(p.id+p.name))});
    sections.push({title:'Web fetch', items:list.filter(p=>/jina|firecrawl|fetch/i.test(p.id+p.name))});
    sections.push({title:'CLI & local tools', items:list.filter(p=>p.kind==='tools')});
    sections.push({title:'Other search tools', items:list.filter(p=>!sections.some(s=>s.items.includes(p)))});
  } else if(kindTab==='audio'){
    sections.push({title:'Text-to-speech', items:list.filter(p=>/tts|eleven|openai-audio|edge|coqui|tortoise|google-tts/i.test(p.id+p.name))});
    sections.push({title:'Speech-to-text', items:list.filter(p=>/deepgram|whisper|assembly|stt/i.test(p.id+p.name))});
    sections.push({title:'Audio · Other', items:list.filter(p=>!sections.some(s=>s.items.includes(p)))});
  } else if(kindTab==='media'){
    sections.push({title:'Media', items:list});
  } else {
    sections.push({title:'All', items:list});
  }
  return sections.filter(s=>s.items.length);
}

    try{
      const j=await api('/api/admin/test',{method:'POST',body:JSON.stringify({provider:p.id,model:(enabledModels(p)[0]||p.id)})});
      // Prefer readable reply text over raw SSE dump
      let reply='';
      const raw=String(j.content||j.data||'');
      const parts=raw.split('\\n').map(l=>l.replace(/^data:\\s*/,'').trim()).filter(Boolean);
      for(const part of parts){
        if(part==='[DONE]') continue;
        try{
          const o=JSON.parse(part);
          const d=o.choices&&o.choices[0]&&o.choices[0].delta;
          if(d&&d.content) reply+=d.content;
          if(o.error&&o.error.message) reply+=(reply?'\\n':'')+'[Error: '+o.error.message+']';
        }catch{}
      }
      if(!reply && j.error) reply=String(j.error);
      if(!reply) reply=raw.slice(0,500)||JSON.stringify(j,null,2);
      const summary={
        ok:!!j.ok,
        status:j.status||null,
        model:j.model||(enabledModels(p)[0]||p.id),
        reply:reply.trim(),
        error:j.error||null,
      };
      out.textContent=JSON.stringify(summary,null,2);
      if(copyBtn){
        copyBtn.style.display='grid';
        copyBtn.onclick=async()=>{await copyText(out.textContent);toast('Copied test result')};
      }
      toast(j.ok?'OK':(j.error||summary.reply||'fail'));
    }catch(e){
      out.textContent=JSON.stringify({ok:false,error:e.message||String(e)},null,2);
      if(copyBtn){
        copyBtn.style.display='grid';
        copyBtn.onclick=async()=>{await copyText(out.textContent);toast('Copied')};
      }
      toast(e.message);
    }
  };

  if(importModelsOpen) wireImport(p);
}
function enabledModels(p){const c=connMap[p.id]||{};const custom=c.customModels||[];const en=c.enabledModels;const base=p.models||[];if(Array.isArray(en)&&en.length)return Array.from(new Set([...en,...custom]));return Array.from(new Set([...(base.slice(0,3)),...custom]))}

function renderAccountModal(p,fields){
  const inputs=fields.map(f=>`<div style="margin-bottom:10px"><label class="lbl">${f.label}</label>
    ${f.area?`<textarea data-af="${f.key}" placeholder="${f.key}"></textarea>`:`<input data-af="${f.key}" type="password" placeholder="${f.key}"/>`}</div>`).join('');
  return `<div class="modal-bg" id="mbg"><div class="modal">
    <button class="x" id="mx">${ICO.close}</button>
    <h3>Add account · ${p.name}</h3>
    <p class="muted" style="margin-top:0;font-size:12px">Only the fields this provider needs.</p>
    <label class="lbl">Account name</label><input id="aname" placeholder="Account 1"/>
    ${inputs}
    <button class="btn primary" id="asave" style="margin-top:8px">Save account</button>
  </div></div>`;
}
function wireAccountModal(p,fields,accounts){
  const close=()=>{modal=null;render()};
  document.getElementById('mx').onclick=close;
  document.getElementById('mbg').onclick=e=>{if(e.target.id==='mbg')close()};
  document.getElementById('asave').onclick=async()=>{
    const name=document.getElementById('aname').value.trim()||('Account '+(accounts.length+1));
    const values={};
    document.querySelectorAll('[data-af]').forEach(el=>{const v=el.value.trim();if(v)values[el.getAttribute('data-af')]=v});
    if(!Object.keys(values).length) return toast('Enter at least one value');
    const next=[...accounts,{name,values,key:values[fields[0]?.key]||Object.values(values)[0]}];
    await persistAccounts(p,next); modal=null; toast('Account added'); render();
  };
}

async function loadEndpointModels(p){
  importModelsState={loading:true,items:[],selected:new Set()}; importModelsOpen=true; render();
  try{
    let data=[];
    if(p.id==='kiro'){
      const j=await fetch('/api/providers/kiro/models').then(r=>r.json());
      data=Array.isArray(j.data)?j.data:[];
    } else {
      // `?all=1` keeps the full catalog so models can be imported before a
      // provider has credentials; public /v1/models only lists configured ones.
      const j=await fetch('/v1/models?all=1').then(r=>r.json());
      data=Array.isArray(j.data)?j.data:[];
      const id=p.id.toLowerCase();
      const filtered=data.filter(x=>String(x.id||'').toLowerCase().includes(id));
      if(filtered.length) data=filtered;
    }
    // also merge catalog models
    for(const m of (p.models||[])){
      if(!data.some(x=>(x.id||x)===m)) data.push({id:m});
    }
    importModelsState={loading:false,items:data,selected:new Set()};
  }catch(e){importModelsState={loading:false,items:[],selected:new Set(),error:e.message}}
  render();
}
function renderImport(p){
  const {loading,items,selected,error}=importModelsState;
  const rows=(items||[]).map(m=>{const id=m.id||m;return `<label class="model-pick"><input type="checkbox" data-mid="${id}" ${selected.has(id)?'checked':''}/><code>${id}</code></label>`}).join('');
  return `<div class="modal-bg" id="imbg"><div class="modal">
    <button class="x" id="imx">${ICO.close}</button>
    <h3>Import models · ${p.name}</h3>
    <p class="muted" style="font-size:12px">From <code>/v1/models?all=1</code></p>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <button class="btn ghost" id="imrefresh">${ICO.refresh} Refresh</button>
      <button class="btn ghost" id="imall">Select all</button>
    </div>
    <div style="max-height:42vh;overflow:auto">${loading?'Loading…':(error||rows||'No models')}</div>
    <button class="btn primary" id="imsave" style="margin-top:12px">${ICO.check} Import selected</button>
  </div></div>`;
}
function wireImport(p){
  const close=()=>{importModelsOpen=false;render()};
  document.getElementById('imx').onclick=close;
  document.getElementById('imbg').onclick=e=>{if(e.target.id==='imbg')close()};
  document.getElementById('imrefresh').onclick=()=>loadEndpointModels(p);
  document.getElementById('imall').onclick=()=>{importModelsState.selected=new Set((importModelsState.items||[]).map(x=>x.id||x));render()};
  document.querySelectorAll('[data-mid]').forEach(cb=>cb.onchange=()=>{const id=cb.getAttribute('data-mid');if(cb.checked)importModelsState.selected.add(id);else importModelsState.selected.delete(id)});
  document.getElementById('imsave').onclick=async()=>{
    const lines=Array.from(importModelsState.selected||[]); if(!lines.length)return toast('Select models');
    await saveConn(p.id,{customModels:Array.from(new Set([...((connMap[p.id]||{}).customModels||[]),...lines])),enabledModels:Array.from(new Set([...enabledModels(p),...lines])),accounts:accountsOf(p)});
    importModelsOpen=false; toast('Imported '+lines.length); render();
  };
}

function renderCustom(){
  document.getElementById('nav').style.display='flex'; document.body.classList.add('is-admin'); paintNav();
  document.querySelectorAll('#nav [data-nav]').forEach(b=>b.classList.toggle('on',b.getAttribute('data-nav')==='custom'));
  const list=customEndpoints;
  const rows=list.map((c,i)=>`<div class="conn"><div><div style="font-weight:650">${c.name||c.id}</div>
    <code>${c.type||'openai'} · ${c.base}</code></div>
    <button class="btn ghost" data-del-c="${i}" style="padding:8px">${ICO.trash}</button></div>`).join('')||'<div class="empty">No custom endpoints</div>';
  document.getElementById('root').innerHTML=`<div class="wrap">
    ${topbarHTML('Custom endpoints','OpenAI-compatible or Anthropic-compatible bases')}
    <div class="card anim">${rows}
      <button class="btn primary" id="addCustom" style="margin-top:10px">${ICO.plus} Add endpoint</button>
    </div>
  </div>${modal&&modal.custom?renderCustomModal():''}`;
  document.getElementById('logout').onclick=()=>{token='';sessionStorage.removeItem('admin_token');render()};
  document.getElementById('navMenu')&&(document.getElementById('navMenu').onclick=openNavDrawer);
  document.getElementById('addCustom').onclick=()=>{modal={custom:true};render()};
  document.querySelectorAll('[data-del-c]').forEach(b=>b.onclick=async()=>{
    const next=list.filter((_,i)=>i!==Number(b.getAttribute('data-del-c')));
    await saveCustom(next); toast('Removed'); render();
  });
  if(modal&&modal.custom) wireCustomModal(list);
}
function renderCustomModal(){
  return `<div class="modal-bg" id="mbg"><div class="modal">
    <button class="x" id="mx">${ICO.close}</button>
    <h3>Add custom endpoint</h3>
    <label class="lbl">Id (model prefix)</label><input id="cid" placeholder="my-openai"/>
    <label class="lbl" style="margin-top:8px">Name</label><input id="cname" placeholder="My OpenAI"/>
    <label class="lbl" style="margin-top:8px">Type</label>
    <select id="ctype"><option value="openai">OpenAI-compatible</option><option value="anthropic">Anthropic-compatible</option></select>
    <label class="lbl" style="margin-top:8px">Base URL</label><input id="cbase" placeholder="https://api.example.com/v1"/>
    <label class="lbl" style="margin-top:8px">API key</label><input id="ckey" type="password"/>
    <label class="lbl" style="margin-top:8px">Default model (optional)</label><input id="cmodel" placeholder="gpt-4o-mini"/>
    <button class="btn primary" id="csave" style="margin-top:12px">Save endpoint</button>
  </div></div>`;
}
async function saveCustom(list){
  customEndpoints=list;
  await saveConn('__custom_endpoints',{list});
  await api('/api/admin/config',{method:'POST',body:JSON.stringify({CUSTOM_ENDPOINTS:JSON.stringify(list)})});
}
function wireCustomModal(list){
  const close=()=>{modal=null;render()};
  document.getElementById('mx').onclick=close;
  document.getElementById('mbg').onclick=e=>{if(e.target.id==='mbg')close()};
  document.getElementById('csave').onclick=async()=>{
    const id=document.getElementById('cid').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,'');
    const base=document.getElementById('cbase').value.trim();
    const key=document.getElementById('ckey').value.trim();
    if(!id||!base||!key) return toast('Id, base URL and key required');
    const entry={id,name:document.getElementById('cname').value.trim()||id,type:document.getElementById('ctype').value,base,keys:[key],defaultModel:document.getElementById('cmodel').value.trim()};
    await saveCustom([...list,entry]); modal=null; toast('Endpoint added'); render();
  };
}



async function renderProxies(){
  document.getElementById('nav').style.display='flex'; document.body.classList.add('is-admin'); paintNav();
  let st={enabled:false,live:0,raw:0,liveList:[],hint:''};
  try{ st = await fetch('/api/proxy-pool?detail=1').then(r=>r.json()); }catch(e){ st.hint=e.message; }
  const liveRows=(st.liveList||[]).map(p=>`<div class="proxy-row">
    <div style="min-width:0"><code>${p.url}</code>
      <div class="muted" style="font-size:11px;margin-top:4px">${p.latency||0}ms · fails ${p.fails||0} · ${p.scheme||'http'}</div></div>
    <button class="btn ghost" data-rm="${encodeURIComponent(p.raw||p.url)}" style="padding:8px;color:#fca5a5">Remove</button>
  </div>`).join('') || '<div class="empty">No live proxies — import a list and run health check</div>';
  const settings=st.settings||{};
  document.getElementById('root').innerHTML=`<div class="wrap">
    ${topbarHTML('Proxy pool','Outbound IP rotation · Pollinations / CF bypass')}
    <div class="proxy-stats anim">
      <div class="proxy-stat"><b>${st.live||0}</b><span>Live</span></div>
      <div class="proxy-stat"><b>${st.raw||st.rawFullCount||0}</b><span>Loaded</span></div>
      <div class="proxy-stat"><b>${st.enabled?'ON':'OFF'}</b><span>Status</span></div>
    </div>
    <div class="card anim">
      <div class="muted" style="margin-bottom:10px;font-size:12px">${st.hint||''}${st.lastError?' · '+st.lastError:''}${st.testing?' · testing…':''}</div>
      <div class="proxy-actions">
        <button class="btn primary" id="pxHealth">Health check</button>
        <button class="btn ghost" id="pxRefresh">Refresh list</button>
        <button class="btn ghost" id="pxClear" style="color:#fca5a5">Clear all</button>
      </div>
      <div class="muted" style="font-size:11px;margin-bottom:8px">Settings: max ${settings.max||'—'} · timeout ${settings.testTimeoutMs||'—'}ms · cooldown ${settings.cooldownMs||'—'}ms</div>
    </div>
    <div class="card anim">
      <h3 style="margin:0 0 8px;font-size:15px">Add proxies</h3>
      <p class="muted" style="margin:0 0 10px;font-size:12px">One per line: <code>http://host:port</code> or <code>host:port</code>. CSV columns accepted (uses first host:port field). SOCKS lines are stored but only HTTP is health-tested for fetch.</p>
      <textarea class="ta-proxy" id="pxText" placeholder="http://1.2.3.4:8080&#10;5.6.7.8:3128"></textarea>
      <div class="proxy-actions">
        <button class="btn primary" id="pxImport">Import (merge)</button>
        <button class="btn ghost" id="pxReplace">Replace all</button>
        <button class="btn ghost" id="pxPaste">Paste clipboard</button>
        <label class="btn ghost file-btn">Upload .txt/.csv<input type="file" id="pxFile" accept=".txt,.csv,text/plain,text/csv"/></label>
      </div>
    </div>
    <div class="section-label">Live proxies · ${(st.liveList||[]).length}</div>
    <div class="anim">${liveRows}</div>
  </div>`;
  document.getElementById('logout').onclick=()=>{token='';sessionStorage.removeItem('admin_token');render()};
  document.getElementById('navMenu')&&(document.getElementById('navMenu').onclick=openNavDrawer);
  const reload=()=>renderProxies();
  document.getElementById('pxHealth').onclick=async()=>{
    toast('Health checking…');
    try{ await fetch('/api/proxy-pool/refresh',{method:'POST'}); toast('Health check done'); reload(); }
    catch(e){toast(e.message)}
  };
  document.getElementById('pxRefresh').onclick=reload;
  document.getElementById('pxClear').onclick=async()=>{
    if(!confirm('Remove all proxies from the pool?')) return;
    try{ await fetch('/api/proxy-pool/clear',{method:'POST'}); toast('Cleared'); reload(); }catch(e){toast(e.message)}
  };
  async function doImport(replace){
    const text=document.getElementById('pxText').value||'';
    if(!text.trim()){toast('Paste or upload proxies first');return}
    toast(replace?'Replacing…':'Importing…');
    try{
      const r=await fetch('/api/proxy-pool/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,replace:!!replace})});
      const j=await r.json();
      if(!r.ok) throw new Error(j.error||'import failed');
      toast(`Loaded ${j.raw||0} · live ${j.live||0}`);
      reload();
    }catch(e){toast(e.message)}
  }
  document.getElementById('pxImport').onclick=()=>doImport(false);
  document.getElementById('pxReplace').onclick=()=>{ if(confirm('Replace entire pool with this list?')) doImport(true); };
  document.getElementById('pxPaste').onclick=async()=>{
    try{
      const t=await navigator.clipboard.readText();
      document.getElementById('pxText').value=t;
      toast('Pasted from clipboard');
    }catch{toast('Clipboard blocked — paste manually into the box')}
  };
  document.getElementById('pxFile').onchange=async(e)=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const t=await f.text();
    document.getElementById('pxText').value=t;
    toast('Loaded '+f.name);
  };
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{
    const u=decodeURIComponent(b.getAttribute('data-rm'));
    try{
      await fetch('/api/proxy-pool/remove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u})});
      toast('Removed'); reload();
    }catch(e){toast(e.message)}
  });
}

async function renderHidden(){
  document.getElementById('nav').style.display='flex'; document.body.classList.add('is-admin'); paintNav();
  let all=[];
  try{ all = await fetch('/admin-providers.json?all=1').then(r=>r.json()); }catch{ all=[]; }
  const hidden = all.filter(p=>p.hidden);
  const rows = hidden.map(p=>`<div class="conn"><div style="min-width:0"><div style="font-weight:650">${p.name}</div>
    <code>${p.id} · ${p.kind||'chat'}</code></div>
    <button class="btn primary" data-restore="${p.id}" style="padding:8px 12px">Restore</button></div>`).join('')
    || '<div class="empty">No hidden providers</div>';

function renderIcons(){
  document.getElementById('nav').style.display='flex'; document.body.classList.add('is-admin'); paintNav();
  document.querySelectorAll('#nav [data-nav]').forEach(b=>b.classList.toggle('on',b.getAttribute('data-nav')==='icons'));
  const cards=PROVIDERS.map(p=>`<div class="icon-card anim"><div class="box" style="background:${p.color||'#111'}">${icon(p)}</div>
    <div style="font-weight:650;font-size:12px">${p.name}</div>
    <input type="url" data-url="${p.id}" placeholder="https://…/icon.svg" style="margin:8px 0;font-size:11px;padding:8px"/>
    <button class="btn ghost block" data-save-url="${p.id}" style="padding:8px;margin-bottom:6px">Save link</button>
    <label class="btn ghost block" style="padding:8px;cursor:pointer">Upload<input type="file" accept="image/*" hidden data-up="${p.id}"/></label>
  </div>`).join('');
  document.getElementById('root').innerHTML=`<div class="wrap">${topbarHTML('Icons','Auto library + your overrides')}
    <div class="icon-grid stagger">${cards}</div></div>`;
  document.getElementById('logout').onclick=()=>{token='';sessionStorage.removeItem('admin_token');render()};
  document.getElementById('navMenu')&&(document.getElementById('navMenu').onclick=openNavDrawer);
  document.querySelectorAll('[data-save-url]').forEach(btn=>btn.onclick=async()=>{
    const id=btn.getAttribute('data-save-url'); const url=document.querySelector(`[data-url="${id}"]`).value.trim();
    try{const j=await api('/api/admin/icon-link',{method:'POST',body:JSON.stringify({id,url})});iconsMap=j.icons||iconsMap;toast('Saved');renderIcons()}catch(e){toast(e.message)}
  });
  document.querySelectorAll('[data-up]').forEach(inp=>inp.onchange=async()=>{
    const id=inp.getAttribute('data-up'); const file=inp.files&&inp.files[0]; if(!file)return;
    const dataUrl=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(file)});
    try{const j=await api('/api/admin/icon',{method:'POST',body:JSON.stringify({id,mime:file.type,data:String(dataUrl).split(',')[1]||''})});iconsMap=j.icons||iconsMap;toast('Uploaded');renderIcons()}catch(e){toast(e.message)}
  });
}

function wireNav(){
  paintNav();
  document.querySelectorAll('#nav [data-nav]').forEach(b=>b.onclick=()=>{
    view.tab=b.getAttribute('data-nav');
    view.page=view.tab==='icons'?'icons':view.tab==='custom'?'custom':'list';
    view.id=null; filter=''; render();
  });
}
async function render(){
  try{
    if(!token) return renderLogin();
    await load(); wireNav();
    if(view.page==='proxies'||view.tab==='proxies') return renderProxies();
    if(view.page==='hidden'||view.tab==='hidden') return renderHidden();
    if(view.page==='icons'||view.tab==='icons') return renderIcons();
    if(view.page==='custom'||view.tab==='custom') return renderCustom();
    if(view.page==='detail') return renderDetail();
    return renderList();
  }catch(e){console.error(e);toast(e.message||String(e));if(/unauthorized|ADMIN/i.test(String(e.message||''))){token='';sessionStorage.removeItem('admin_token');renderLogin()}}
}
render();
</script>
