<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0c0f12"/>
<title>Providers · Use-AI Proxy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  color-scheme:dark;
  --bg:#0c0f12; --panel:#161a20; --panel2:#1c222b; --line:#2a3340; --text:#eef2f7; --muted:#8b96a8;
  --accent:#3b82f6; --orange:#e85d3a; --ok:#22c55e; --danger:#ef4444;
  --font:Inter,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace; --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:400 14px/1.45 var(--font)}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 80px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin-bottom:14px;background:none;border:0;cursor:pointer;padding:0}
.hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.hdr .icon{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:#fff;overflow:hidden;flex-shrink:0}
.hdr .icon img{width:100%;height:100%;object-fit:cover}
.hdr h1{margin:0;font-size:22px;font-weight:650}
.hdr .sub{color:var(--muted);font-size:13px;margin-top:2px}
.hdr .ext{font-size:12px;color:var(--orange);margin-left:6px}
.info{background:#132033;border:1px solid #1e3a5f;border-radius:var(--r);padding:14px;margin-bottom:14px;color:#b6c9e2;font-size:13px;line-height:1.5}
.info button,.info a.btn{display:block;width:100%;margin-top:12px;text-align:center;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px;font:600 14px var(--font);cursor:pointer}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{margin:0 0 12px;font-size:15px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted);font-size:13px}
.switch{position:relative;width:44px;height:26px;background:#3a4452;border-radius:999px;cursor:pointer;border:0;flex-shrink:0}
.switch.on{background:#3b82f6}
.switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.15s}
.switch.on i{left:21px}
.empty{text-align:center;padding:18px 8px;color:var(--muted)}
.empty .key{width:40px;height:40px;border-radius:50%;background:#2a3340;display:grid;place-items:center;margin:0 auto 8px;font-size:18px}
.btn{border:0;border-radius:10px;padding:11px 14px;font:600 13px var(--font);cursor:pointer}
.btn.primary{background:var(--orange);color:#fff;width:100%}
.btn.blue{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.block{width:100%}
.conn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.conn code{font-family:var(--mono);font-size:11px;color:#93c5fd}
.accordion{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
.accordion summary{list-style:none;padding:14px;cursor:pointer;font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.accordion summary::-webkit-details-marker{display:none}
.accordion .inner{padding:0 14px 14px}
label.lbl{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:11px 12px;font:400 13px/1.4 var(--mono);outline:none}
textarea{min-height:100px;resize:vertical}
.seg{display:inline-flex;background:var(--panel2);border-radius:999px;padding:3px;margin-bottom:12px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:999px;font:600 12px var(--font);cursor:pointer}
.seg button.on{background:var(--orange);color:#fff}
.suggest{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.suggest button{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;font:500 13px var(--font);cursor:pointer}
.suggest button span{color:var(--orange);margin-right:6px}
.model-chip{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:12px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 12px 12px;width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:16px}
.modal h3{margin:0 0 12px;font-size:17px}
.modal .x{float:right;background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer}
.list-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;cursor:pointer}
.list-item:hover{border-color:#3d4b5c}
.pill{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.ok{color:#86efac;border-color:#166534;background:rgba(22,101,52,.25)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1c222b;border:1px solid var(--line);padding:10px 14px;border-radius:10px;opacity:0;transition:.2s;z-index:40;font-size:13px;max-width:90vw}
.toast.show{opacity:1}
.login{max-width:400px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}
.think-menu{position:absolute;right:14px;background:#1a2030;border:1px solid var(--line);border-radius:12px;overflow:hidden;z-index:5;min-width:180px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.think-menu button{display:block;width:100%;text-align:left;padding:12px 14px;border:0;background:transparent;color:var(--text);font:500 13px var(--font);cursor:pointer;border-bottom:1px solid var(--line)}
.think-menu button:last-child{border:0}
.think-menu button.on{color:#c4b5fd}
.rel{position:relative}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script>
/** Provider catalog — 9router-style detail pages */
const PROVIDERS = [
  {
    id: 'deepseek', name: 'DeepSeek', color: '#4D6BFE', text: 'DS',
    site: 'https://chat.deepseek.com', keyUrl: 'https://chat.deepseek.com',
    blurb: 'Web session proxy. Paste token + cookie from chat.deepseek.com (console JS or Application).',
    auth: 'session', fields: [
      { key: 'DEEPSEEK_TOKEN', label: 'Token' },
      { key: 'DEEPSEEK_COOKIE', label: 'Cookie', area: true },
      { key: 'DEEPSEEK_URL', label: 'Base URL' },
    ],
    models: ['deepseek-chat','deepseek-reasoner'], suggested: ['deepseek-chat','deepseek-reasoner'],
  },
  {
    id: 'kimi', name: 'Kimi / Moonshot', color: '#111', text: 'Ki',
    site: 'https://www.kimi.ai', keyUrl: 'https://www.kimi.ai',
    blurb: 'Web session. Access token expires ~15m; refresh token lasts longer.',
    auth: 'session', fields: [
      { key: 'KIMI_TOKEN', label: 'Access token', area: true },
      { key: 'KIMI_REFRESH_TOKEN', label: 'Refresh token', area: true },
      { key: 'KIMI_URL', label: 'Base URL' },
    ],
    models: ['kimi','kimi-k2'], suggested: ['kimi','kimi-k2'],
  },
  {
    id: 'mistral', name: 'Mistral', color: '#F7D046', text: 'M',
    site: 'https://console.mistral.ai', keyUrl: 'https://console.mistral.ai',
    blurb: 'Official API keys. Codestral works on free/trial tiers depending on account.',
    auth: 'apikey', envKey: 'MISTRAL_API_KEYS',
    models: ['codestral','mistral-small'], suggested: ['codestral','mistral-small'],
  },
  {
    id: 'perplexity', name: 'Perplexity Web', color: '#20808D', text: 'Px',
    site: 'https://www.perplexity.ai', keyUrl: 'https://www.perplexity.ai',
    blurb: 'Needs HttpOnly __Secure-next-auth.session-token. Render IPs often hit Cloudflare 403.',
    auth: 'session', fields: [{ key: 'PERPLEXITY_COOKIE', label: 'Session cookie', area: true }],
    models: ['perplexity','pplx-auto'], suggested: ['perplexity'],
  },
  {
    id: 'pollinations', name: 'Pollinations', color: '#F59E0B', text: 'Po',
    site: 'https://pollinations.ai', keyUrl: 'https://pollinations.ai',
    blurb: 'Works without a key for many models. Optional key raises limits.',
    auth: 'apikey', envKey: 'POLLINATIONS_KEY', optional: true,
    models: ['pollinations'], suggested: ['pollinations'],
  },
  {
    id: 'grok', name: 'Grok Web', color: '#1DA1F2', text: 'Gk',
    site: 'https://grok.com', keyUrl: 'https://grok.com',
    blurb: 'Browser cookie session for grok.com.',
    auth: 'session', fields: [{ key: 'GROK_COOKIE', label: 'Cookie', area: true }],
    models: ['grok'], suggested: ['grok'],
  },
  {
    id: 'huggingface', name: 'Hugging Face', color: '#FFD21E', text: 'HF',
    site: 'https://huggingface.co/chat', keyUrl: 'https://huggingface.co/chat',
    blurb: 'hf-chat cookie from huggingface.co/chat.',
    auth: 'session', fields: [{ key: 'HF_CHAT_COOKIE', label: 'hf-chat cookie' }],
    models: ['hf'], suggested: ['hf'],
  },
  {
    id: 'opencode', name: 'OpenCode Free', color: '#E87040', text: 'OC',
    site: 'https://opencode.ai', keyUrl: 'https://opencode.ai',
    blurb: 'Public free inference. Enable with OPENCODE_ENABLED=1.',
    auth: 'session', fields: [{ key: 'OPENCODE_ENABLED', label: 'Enabled (1/0)' }],
    models: ['opencode'], suggested: ['opencode'],
  },
];

const THINKING = ['Auto', 'Low', 'Medium', 'High'];

let token = sessionStorage.getItem('admin_token') || '';
let statusMap = {};
let iconsMap = {};
let connMap = {};
let view = { page: 'list', id: null }; // list | detail
let modal = null; // { mode: 'single'|'bulk' }
let thinkOpen = false;
let bulkMode = false;

function toast(msg, ok) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderColor = ok === false ? 'var(--danger)' : 'var(--line)';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3200);
}
async function api(path, opts = {}) {
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (token) headers.Authorization = 'Bearer ' + token;
  const r = await fetch(path, { ...opts, headers });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function configured(p) {
  if (p.auth === 'apikey') {
    if (p.optional) return true;
    const k = p.envKey || '';
    const alt = k.replace(/S$/, '');
    return !!(statusMap[k]?.configured || statusMap[alt]?.configured || statusMap[k.replace('_KEYS','_KEY')]?.configured);
  }
  return (p.fields || []).some(f => statusMap[f.key]?.configured);
}
function icon(p) {
  if (iconsMap[p.id]) return `<img src="${iconsMap[p.id]}" alt=""/>`;
  return p.text;
}
function parseConnections(p) {
  // stored in PROVIDER_CONNECTIONS[id].accounts: [{name, key}]
  const c = connMap[p.id] || {};
  return Array.isArray(c.accounts) ? c.accounts : [];
}
function getThinking(p) {
  return (connMap[p.id] && connMap[p.id].thinkingLevel) || 'Auto';
}
function enabledModels(p) {
  const c = connMap[p.id] || {};
  const custom = c.customModels || [];
  const enabled = c.enabledModels;
  const base = p.models || [];
  if (Array.isArray(enabled) && enabled.length) return Array.from(new Set([...enabled, ...custom]));
  return Array.from(new Set([...base.slice(0, 2), ...custom]));
}

async function load() {
  statusMap = await api('/api/admin/status');
  try { iconsMap = (await fetch('/api/providers-catalog').then(r => r.json())).icons || {}; } catch { iconsMap = {}; }
  try { connMap = await api('/api/admin/connections'); } catch { connMap = {}; }
}

function renderLogin() {
  document.getElementById('root').innerHTML = `
  <div class="login">
    <h1 style="margin:0 0 8px;font-size:18px">Admin login</h1>
    <p class="muted">ADMIN_PASSWORD</p>
    <label class="lbl">Password</label>
    <input id="pw" type="password"/>
    <button class="btn blue block" style="margin-top:12px" id="go">Sign in</button>
  </div>`;
  document.getElementById('go').onclick = async () => {
    token = document.getElementById('pw').value.trim();
    sessionStorage.setItem('admin_token', token);
    try { await api('/api/admin/status'); render(); }
    catch (e) { token = ''; sessionStorage.removeItem('admin_token'); toast(e.message, false); }
  };
}

function renderList() {
  const items = PROVIDERS.map(p => {
    const on = configured(p);
    const n = parseConnections(p).length;
    return `<div class="list-item" data-open="${p.id}">
      <div class="hdr icon" style="background:${p.color};width:42px;height:42px;margin:0">${icon(p)}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600">${p.name}</div>
        <div class="muted" style="font-size:12px">${n} connection${n===1?'':'s'}</div>
      </div>
      <span class="pill ${on?'ok':''}">${on?'ready':'setup'}</span>
    </div>`;
  }).join('');
  document.getElementById('root').innerHTML = `
  <div class="wrap">
    <div class="topbar">
      <div>
        <div style="font-weight:700;font-size:18px">Providers</div>
        <div class="muted">9router-style connections</div>
      </div>
      <button class="btn ghost" id="logout">Logout</button>
    </div>
    ${items}
    <p class="muted" style="margin-top:18px;font-size:12px">
      <a href="/providers">Icons</a> · <a href="/v1/models">/v1/models</a> · <a href="/health">/health</a>
    </p>
  </div>`;
  document.getElementById('logout').onclick = () => { token=''; sessionStorage.removeItem('admin_token'); render(); };
  document.querySelectorAll('[data-open]').forEach(el => {
    el.onclick = () => { view = { page: 'detail', id: el.getAttribute('data-open') }; thinkOpen = false; modal = null; render(); };
  });
}

function saveConn(id, patch) {
  const prev = connMap[id] || {};
  const next = { ...prev, ...patch };
  return api('/api/admin/connections', { method: 'POST', body: JSON.stringify({ id, ...next }) }).then(all => {
    connMap = all;
    return all;
  });
}

async function saveApiKeys(p, accounts) {
  // persist structured accounts + flatten to env
  await saveConn(p.id, { accounts, roundRobin: !!(connMap[p.id] && connMap[p.id].roundRobin) });
  const flat = accounts.map(a => (a.name ? `${a.name}|${a.key}` : a.key)).join('\n');
  const body = {};
  body[p.envKey || 'OPENROUTER_API_KEYS'] = flat;
  if (p.envKey === 'OPENROUTER_API_KEYS') body.OPENROUTER_API_KEY = accounts[0]?.key || '';
  if (p.envKey === 'MISTRAL_API_KEYS') body.MISTRAL_API_KEY = accounts[0]?.key || '';
  statusMap = await api('/api/admin/config', { method: 'POST', body: JSON.stringify(body) });
}

function renderDetail() {
  const p = PROVIDERS.find(x => x.id === view.id);
  if (!p) { view.page = 'list'; return renderList(); }
  const accounts = parseConnections(p);
  const rr = !!(connMap[p.id] && connMap[p.id].roundRobin);
  const thinking = getThinking(p);
  const models = enabledModels(p);

  const connBlock = accounts.length
    ? accounts.map((a, i) => `<div class="conn">
        <div><div style="font-weight:600;font-size:13px">${a.name || ('Key ' + (i+1))}</div>
        <code>${String(a.key||'').slice(0,8)}…${String(a.key||'').slice(-4)}</code></div>
        <button class="btn ghost" data-del-acc="${i}" style="padding:6px 10px">Remove</button>
      </div>`).join('')
    : `<div class="empty"><div class="key">🔑</div>No connections yet</div>`;

  const modelBlock = models.map(m => `<div class="model-chip"><span>${m}</span>
    <button class="btn ghost" data-rm-model="${m}" style="padding:4px 8px">✕</button></div>`).join('');

  const suggested = (p.suggested || []).filter(m => !models.includes(m)).map(m =>
    `<button data-add-sug="${m}"><span>+</span> ${m}</button>`).join('');

  document.getElementById('root').innerHTML = `
  <div class="wrap">
    <button class="back" id="back">← Back to Providers</button>
    <div class="hdr">
      <div class="icon" style="background:${p.color}">${icon(p)}</div>
      <div style="flex:1">
        <h1>${p.name} ${p.keyUrl ? `<a class="ext" href="${p.keyUrl}" target="_blank" rel="noopener">Get API Key ↗</a>` : ''}</h1>
        <div class="sub">${accounts.length} connection${accounts.length===1?'':'s'}</div>
      </div>
    </div>

    <div class="info">
      ${p.blurb || ''}
      ${p.keyUrl ? `<a class="btn" href="${p.keyUrl}" target="_blank" rel="noopener">Get API Key →</a>` : ''}
    </div>

    <div class="card">
      <div class="row" style="margin-bottom:12px">
        <h2 style="margin:0">Connections</h2>
        <div class="row" style="gap:8px">
          <span class="muted" style="font-size:12px">Round Robin</span>
          <button class="switch ${rr?'on':''}" id="rr" type="button"><i></i></button>
        </div>
      </div>
      ${connBlock}
      <button class="btn primary" id="addConn" style="margin-top:8px">+ Add Connection</button>
    </div>

    ${p.auth === 'session' ? `
    <div class="card">
      <h2>Session values</h2>
      ${(p.fields||[]).map(f => `
        <div style="margin-bottom:10px">
          <label class="lbl">${f.label} · ${f.key}</label>
          ${f.area ? `<textarea data-f="${f.key}" placeholder="${statusMap[f.key]?.preview||''}"></textarea>` : `<input data-f="${f.key}" type="password" placeholder="${statusMap[f.key]?.preview||''}"/>`}
        </div>`).join('')}
      <button class="btn blue block" id="saveSession">Save values</button>
      <button class="btn ghost block" id="copyConsole" style="margin-top:8px">Copy console JS</button>
    </div>` : ''}

    <details class="accordion">
      <summary>Custom Headers <span class="muted">›</span></summary>
      <div class="inner">
        <p class="muted" style="font-size:12px">Optional JSON headers merged into upstream requests for this provider.</p>
        <textarea id="custHdr" placeholder='{"X-Title":"my app"}'>${(connMap[p.id]&&connMap[p.id].customHeaders)||''}</textarea>
        <button class="btn ghost block" id="saveHdr" style="margin-top:8px">Save headers</button>
      </div>
    </details>

    <div class="card rel">
      <div class="row" style="margin-bottom:10px">
        <h2 style="margin:0">Available Models</h2>
        <button class="btn ghost" id="thinkBtn" style="padding:6px 10px">Thinking: ${thinking}</button>
      </div>
      ${thinkOpen ? `<div class="think-menu">${THINKING.map(t =>
        `<button data-think="${t}" class="${t===thinking?'on':''}">Thinking: ${t}</button>`).join('')}</div>` : ''}
      ${modelBlock || '<div class="muted">No models enabled</div>'}
      <button class="btn ghost block" id="addModel" style="border-style:dashed;margin-top:8px">+ Add Model</button>
      <p class="muted" style="margin:12px 0 6px;font-size:12px">Suggested free models</p>
      <div class="suggest">${suggested || '<span class="muted">None</span>'}</div>
    </div>

    <div class="card">
      <h2>Test connection</h2>
      <button class="btn blue block" id="test">Test connection</button>
      <pre id="testOut" class="muted" style="white-space:pre-wrap;font-family:var(--mono);font-size:11px;margin-top:10px"></pre>
    </div>
  </div>
  ${modal ? renderModal(p) : ''}`;

  document.getElementById('back').onclick = () => { view = { page: 'list', id: null }; render(); };
  document.getElementById('rr').onclick = async () => {
    try {
      await saveConn(p.id, { roundRobin: !rr, accounts });
      if (p.auth === 'apikey') {
        await api('/api/admin/config', { method: 'POST', body: JSON.stringify({ OPENROUTER_ROUND_ROBIN: !rr ? '1' : '0' }) });
      }
      toast('Round robin ' + (!rr ? 'on' : 'off'), true);
      render();
    } catch (e) { toast(e.message, false); }
  };
  document.getElementById('addConn').onclick = () => { modal = { mode: 'single' }; bulkMode = false; render(); };
  const tb = document.getElementById('thinkBtn');
  if (tb) tb.onclick = () => { thinkOpen = !thinkOpen; render(); };
  document.querySelectorAll('[data-think]').forEach(b => {
    b.onclick = async () => {
      await saveConn(p.id, { thinkingLevel: b.getAttribute('data-think'), accounts });
      thinkOpen = false;
      toast('Thinking saved', true);
      render();
    };
  });
  document.querySelectorAll('[data-del-acc]').forEach(b => {
    b.onclick = async () => {
      const i = Number(b.getAttribute('data-del-acc'));
      const next = accounts.filter((_, idx) => idx !== i);
      try {
        if (p.auth === 'apikey') await saveApiKeys(p, next);
        else await saveConn(p.id, { accounts: next });
        toast('Removed', true);
        render();
      } catch (e) { toast(e.message, false); }
    };
  });
  document.querySelectorAll('[data-add-sug]').forEach(b => {
    b.onclick = async () => {
      const m = b.getAttribute('data-add-sug');
      const enabled = Array.from(new Set([...enabledModels(p), m]));
      await saveConn(p.id, { enabledModels: enabled, customModels: (connMap[p.id]?.customModels)||[], accounts });
      toast('Model added', true);
      render();
    };
  });
  document.querySelectorAll('[data-rm-model]').forEach(b => {
    b.onclick = async () => {
      const m = b.getAttribute('data-rm-model');
      const enabled = enabledModels(p).filter(x => x !== m);
      const custom = ((connMap[p.id]||{}).customModels||[]).filter(x => x !== m);
      await saveConn(p.id, { enabledModels: enabled, customModels: custom, accounts });
      render();
    };
  });
  document.getElementById('addModel').onclick = async () => {
    const m = prompt('Model id');
    if (!m) return;
    const custom = Array.from(new Set([...((connMap[p.id]||{}).customModels||[]), m.trim()]));
    const enabled = Array.from(new Set([...enabledModels(p), m.trim()]));
    await saveConn(p.id, { customModels: custom, enabledModels: enabled, accounts });
    render();
  };
  document.getElementById('test').onclick = async () => {
    const out = document.getElementById('testOut');
    out.textContent = 'Testing…';
    try {
      const j = await api('/api/admin/test', { method: 'POST', body: JSON.stringify({ provider: p.id, model: models[0] || p.id }) });
      out.textContent = JSON.stringify(j, null, 2);
      toast(j.ok ? 'OK' : (j.error || 'Failed'), !!j.ok);
    } catch (e) { out.textContent = e.message; toast(e.message, false); }
  };
  const ss = document.getElementById('saveSession');
  if (ss) ss.onclick = async () => {
    const body = {};
    document.querySelectorAll('[data-f]').forEach(el => {
      const v = el.value.trim();
      if (v) body[el.getAttribute('data-f')] = v;
    });
    if (!Object.keys(body).length) return toast('Nothing to save', false);
    try {
      statusMap = await api('/api/admin/config', { method: 'POST', body: JSON.stringify(body) });
      toast('Saved', true);
      render();
    } catch (e) { toast(e.message, false); }
  };
  const cc = document.getElementById('copyConsole');
  if (cc) cc.onclick = async () => {
    const script = `copy(document.cookie);console.log('Copied cookies — HttpOnly may be missing')`;
    try { await navigator.clipboard.writeText(script); } catch {}
    toast('Console snippet copied', true);
  };
  const sh = document.getElementById('saveHdr');
  if (sh) sh.onclick = async () => {
    await saveConn(p.id, { customHeaders: document.getElementById('custHdr').value, accounts });
    toast('Headers saved', true);
  };
  if (modal) wireModal(p, accounts);
}

function renderModal(p) {
  return `<div class="modal-bg" id="mbg">
    <div class="modal">
      <button class="x" id="mx">×</button>
      <h3>Add ${p.name} API Key</h3>
      <div class="seg">
        <button class="${!bulkMode?'on':''}" id="tabSingle">Single</button>
        <button class="${bulkMode?'on':''}" id="tabBulk">Bulk Add</button>
      </div>
      ${bulkMode ? `
        <p class="muted" style="font-size:12px;margin-top:0">One key per line. Format: name|apiKey or just apiKey.</p>
        <textarea id="bulk" placeholder="name1|sk-key1&#10;name2|sk-key2&#10;sk-key-only"></textarea>
        <div class="row" style="margin-top:12px;justify-content:flex-end">
          <button class="btn ghost" id="mcancel">Cancel</button>
          <button class="btn primary" id="mbulk" style="width:auto">Add All Keys</button>
        </div>
      ` : `
        <label class="lbl">Name</label>
        <input id="cname" placeholder="Production Key"/>
        <label class="lbl" style="margin-top:10px">API Key</label>
        <input id="ckey" type="password" placeholder="sk-…"/>
        <label class="lbl" style="margin-top:10px">Priority</label>
        <input id="cpri" value="1"/>
        <button class="btn primary" id="msave" style="margin-top:14px">Save connection</button>
      `}
    </div>
  </div>`;
}

function wireModal(p, accounts) {
  const close = () => { modal = null; render(); };
  document.getElementById('mx').onclick = close;
  document.getElementById('mbg').onclick = (e) => { if (e.target.id === 'mbg') close(); };
  document.getElementById('tabSingle').onclick = () => { bulkMode = false; render(); };
  document.getElementById('tabBulk').onclick = () => { bulkMode = true; render(); };
  const cancel = document.getElementById('mcancel');
  if (cancel) cancel.onclick = close;
  const save = document.getElementById('msave');
  if (save) save.onclick = async () => {
    const name = document.getElementById('cname').value.trim() || 'Key';
    const key = document.getElementById('ckey').value.trim();
    if (!key) return toast('API key required', false);
    const next = [...accounts, { name, key, priority: Number(document.getElementById('cpri').value)||1 }];
    try {
      if (p.auth === 'apikey') await saveApiKeys(p, next);
      else await saveConn(p.id, { accounts: next });
      modal = null;
      toast('Connection added', true);
      render();
    } catch (e) { toast(e.message, false); }
  };
  const bulk = document.getElementById('mbulk');
  if (bulk) bulk.onclick = async () => {
    const lines = document.getElementById('bulk').value.split('\n').map(s => s.trim()).filter(Boolean);
    const add = lines.map((line, i) => {
      const pipe = line.indexOf('|');
      if (pipe > 0) return { name: line.slice(0, pipe).trim(), key: line.slice(pipe + 1).trim() };
      return { name: 'Key ' + (accounts.length + i + 1), key: line };
    }).filter(a => a.key);
    try {
      const next = [...accounts, ...add];
      if (p.auth === 'apikey') await saveApiKeys(p, next);
      else await saveConn(p.id, { accounts: next });
      modal = null;
      toast('Added ' + add.length + ' key(s)', true);
      render();
    } catch (e) { toast(e.message, false); }
  };
}

async function render() {
  try {
    if (!token) return renderLogin();
    await load();
    if (view.page === 'detail') renderDetail();
    else renderList();
  } catch (e) {
    console.error(e);
    toast(e.message || String(e), false);
    if (String(e.message || '').includes('unauthorized') || String(e.message||'').includes('ADMIN')) {
      token = ''; sessionStorage.removeItem('admin_token'); renderLogin();
    }
  }
}
render();
</script>
</body>
</html>
