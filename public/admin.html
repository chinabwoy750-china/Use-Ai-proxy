<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0c0f12"/>
<title>Providers · Use-AI Proxy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{color-scheme:dark;--bg:#0c0f12;--panel:#161a20;--panel2:#1c222b;--line:#2a3340;--text:#eef2f7;--muted:#8b96a8;--accent:#3b82f6;--orange:#e85d3a;--ok:#22c55e;--danger:#ef4444;--font:Inter,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;--r:14px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:400 14px/1.45 var(--font)}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 96px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#0e1218;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.nav button{flex:1;background:transparent;border:0;color:var(--muted);font:600 11px var(--font);padding:8px 4px;cursor:pointer}
.nav button.on{color:var(--text)}
.nav button span{display:block;font-size:16px;margin-bottom:2px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin-bottom:14px;background:none;border:0;cursor:pointer;padding:0}
.hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.hdr .icon,.list-item .icon{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:#fff;overflow:hidden;flex-shrink:0}
.hdr .icon img,.list-item .icon img{width:100%;height:100%;object-fit:cover}
.hdr h1{margin:0;font-size:20px;font-weight:650}
.hdr .sub{color:var(--muted);font-size:13px;margin-top:2px}
.info{background:#132033;border:1px solid #1e3a5f;border-radius:var(--r);padding:14px;margin-bottom:14px;color:#b6c9e2;font-size:13px;line-height:1.5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{margin:0 0 12px;font-size:15px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted);font-size:13px}
.switch{position:relative;width:44px;height:26px;background:#3a4452;border-radius:999px;cursor:pointer;border:0;flex-shrink:0}
.switch.on{background:#3b82f6}
.switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.15s}
.switch.on i{left:21px}
.empty{text-align:center;padding:18px 8px;color:var(--muted)}
.btn{border:0;border-radius:10px;padding:11px 14px;font:600 13px var(--font);cursor:pointer}
.btn.primary{background:var(--orange);color:#fff;width:100%}
.btn.blue{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.block{width:100%}
.conn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.conn code{font-family:var(--mono);font-size:11px;color:#93c5fd}
.accordion{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
.accordion summary{list-style:none;padding:14px;cursor:pointer;font-weight:600;font-size:14px}
.accordion .inner{padding:0 14px 14px}
label.lbl{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:11px 12px;font:400 13px/1.4 var(--mono);outline:none}
textarea{min-height:88px;resize:vertical}
.seg{display:inline-flex;background:var(--panel2);border-radius:999px;padding:3px;margin-bottom:12px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:999px;font:600 12px var(--font);cursor:pointer}
.seg button.on{background:var(--orange);color:#fff}
.suggest{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.suggest button{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;font:500 13px var(--font);cursor:pointer}
.suggest button span{color:var(--orange);margin-right:6px}
.model-chip{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:12px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:16px}
.modal h3{margin:0 0 12px;font-size:17px}
.modal .x{float:right;background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer}
.list-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;cursor:pointer}
.list-item:hover{border-color:#3d4b5c}
.pill{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.ok{color:#86efac;border-color:#166534;background:rgba(22,101,52,.25)}
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:#1c222b;border:1px solid var(--line);padding:10px 14px;border-radius:10px;opacity:0;transition:.2s;z-index:40;font-size:13px;max-width:90vw;pointer-events:none}
.toast.show{opacity:1}
.login{max-width:400px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}
.think-menu{position:absolute;right:14px;background:#1a2030;border:1px solid var(--line);border-radius:12px;overflow:hidden;z-index:5;min-width:180px}
.think-menu button{display:block;width:100%;text-align:left;padding:12px 14px;border:0;background:transparent;color:var(--text);font:500 13px var(--font);cursor:pointer;border-bottom:1px solid var(--line)}
.rel{position:relative}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.search{flex:1}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.icon-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.icon-card .box{width:64px;height:64px;margin:0 auto 8px;border-radius:14px;overflow:hidden;display:grid;place-items:center;background:#12161c;border:1px solid var(--line)}
.icon-card .box img{width:100%;height:100%;object-fit:cover}
.section-title{font-size:13px;color:var(--muted);margin:16px 0 8px;font-weight:600}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<nav class="nav" id="nav" style="display:none">
  <button data-nav="providers" class="on"><span>💬</span>Providers</button>
  <button data-nav="media"><span>🎬</span>Media</button>
  <button data-nav="icons"><span>🖼️</span>Icons</button>
</nav>
<script>
const THINKING = ['Auto','Low','Medium','High'];
let PROVIDERS = [];
let token = sessionStorage.getItem('admin_token') || '';
let statusMap = {}, iconsMap = {}, connMap = {};
let view = { tab: 'providers', page: 'list', id: null };
let modal = null, bulkMode = false, thinkOpen = false, filter = '';

function toast(msg, ok){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3200)}
async function api(path, opts={}){
  const headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});
  if(token) headers.Authorization='Bearer '+token;
  const r=await fetch(path,{...opts,headers});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||r.statusText);
  return j;
}
function configured(p){
  if(p.auth==='apikey'){
    if(p.optional) return true;
    const k=p.envKey||'';
    return !!(statusMap[k]?.configured||statusMap[k.replace(/S$/,'')]?.configured||statusMap[k.replace('_KEYS','_KEY')]?.configured);
  }
  return (p.fields||[]).some(f=>statusMap[f.key]?.configured);
}
function icon(p){return iconsMap[p.id]?`<img src="${iconsMap[p.id]}" alt=""/>`: (p.text||p.id.slice(0,2).toUpperCase())}
function parseAccounts(p){const c=connMap[p.id]||{};return Array.isArray(c.accounts)?c.accounts:[]}
function getThinking(p){return (connMap[p.id]&&connMap[p.id].thinkingLevel)||'Auto'}
function enabledModels(p){
  const c=connMap[p.id]||{};
  const custom=c.customModels||[];
  const enabled=c.enabledModels;
  const base=p.models||[];
  if(Array.isArray(enabled)&&enabled.length) return Array.from(new Set([...enabled,...custom]));
  return Array.from(new Set([...(base.slice(0,2)),...custom]));
}
async function load(){
  statusMap=await api('/api/admin/status');
  const cat=await fetch('/api/providers-catalog').then(r=>r.json()).catch(()=>({}));
  iconsMap=cat.icons||{};
  if(!PROVIDERS.length){
    PROVIDERS=await fetch('/admin-providers.json').then(r=>r.json()).catch(()=>cat.providers||[]);
  }
  try{connMap=await api('/api/admin/connections')}catch{connMap={}}
}
async function saveConn(id,patch){
  const prev=connMap[id]||{};
  connMap=await api('/api/admin/connections',{method:'POST',body:JSON.stringify({id,...prev,...patch})});
  return connMap;
}
async function saveApiKeys(p,accounts){
  await saveConn(p.id,{accounts,roundRobin:!!(connMap[p.id]&&connMap[p.id].roundRobin)});
  const flat=accounts.map(a=>a.name?`${a.name}|${a.key}`:a.key).join('\n');
  const body={}; body[p.envKey||'API_KEYS']=flat;
  if(p.envKey) body[p.envKey.replace(/S$/,'')]=accounts[0]?.key||'';
  if(p.envKey==='MISTRAL_API_KEYS') body.MISTRAL_API_KEY=accounts[0]?.key||'';
  statusMap=await api('/api/admin/config',{method:'POST',body:JSON.stringify(body)});
}

function renderLogin(){
  document.getElementById('nav').style.display='none';
  document.getElementById('root').innerHTML=`<div class="login"><h1 style="margin:0 0 8px;font-size:18px">Admin login</h1>
    <label class="lbl">Password</label><input id="pw" type="password"/>
    <button class="btn blue block" style="margin-top:12px" id="go">Sign in</button></div>`;
  document.getElementById('go').onclick=async()=>{
    token=document.getElementById('pw').value.trim();
    sessionStorage.setItem('admin_token',token);
    try{await api('/api/admin/status');render()}catch(e){token='';sessionStorage.removeItem('admin_token');toast(e.message,false)}
  };
}

function listForTab(){
  const kind=view.tab==='media'?'media':'chat';
  return PROVIDERS.filter(p=>{
    const k=p.kind||'chat';
    if(view.tab==='media') return k==='media';
    return k!=='media';
  }).filter(p=>!filter||p.name.toLowerCase().includes(filter)||p.id.includes(filter));
}

function renderList(){
  document.getElementById('nav').style.display='flex';
  document.querySelectorAll('#nav [data-nav]').forEach(b=>b.classList.toggle('on',b.getAttribute('data-nav')===view.tab));
  const items=listForTab().map(p=>{
    const on=configured(p); const n=parseAccounts(p).length;
    return `<div class="list-item" data-open="${p.id}">
      <div class="icon" style="background:${p.color||'#333'};width:42px;height:42px">${icon(p)}</div>
      <div style="flex:1;min-width:0"><div style="font-weight:600">${p.name}</div>
      <div class="muted" style="font-size:12px">${n} connection${n===1?'':'s'} · ${p.kind||'chat'}</div></div>
      <span class="pill ${on?'ok':''}">${on?'ready':'setup'}</span></div>`;
  }).join('')||`<div class="empty">No providers in this tab</div>`;
  document.getElementById('root').innerHTML=`<div class="wrap">
    <div class="topbar">
      <div><div style="font-weight:700;font-size:18px">${view.tab==='media'?'Media':'Providers'}</div>
      <div class="muted">${view.tab==='media'?'Image & video generation':'Chat / LLM providers'} · ${listForTab().length}</div></div>
      <button class="btn ghost" id="logout">Logout</button>
    </div>
    <input class="search" id="search" type="search" placeholder="Filter…" value="${filter.replace(/"/g,'&quot;')}"/>
    <div style="height:10px"></div>
    ${items}
  </div>`;
  document.getElementById('logout').onclick=()=>{token='';sessionStorage.removeItem('admin_token');render()};
  document.getElementById('search').oninput=e=>{filter=e.target.value.trim().toLowerCase();renderList()};
  document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{view.page='detail';view.id=el.getAttribute('data-open');modal=null;thinkOpen=false;render()});
}

function renderIcons(){
  document.getElementById('nav').style.display='flex';
  document.querySelectorAll('#nav [data-nav]').forEach(b=>b.classList.toggle('on',b.getAttribute('data-nav')==='icons'));
  const cards=PROVIDERS.map(p=>{
    const src=iconsMap[p.id];
    const box=src?`<img src="${src}" alt=""/>`:`<span style="background:${p.color||'#333'};width:100%;height:100%;display:grid;place-items:center;color:#fff;font-weight:700">${p.text||p.id.slice(0,2)}</span>`;
    return `<div class="icon-card" data-id="${p.id}">
      <div class="box">${box}</div>
      <div style="font-weight:600;font-size:12px">${p.name}</div>
      <div class="muted" style="font-size:11px;margin:4px 0 8px">${p.id}</div>
      <input type="url" data-url="${p.id}" placeholder="https://…/icon.svg" style="margin-bottom:6px;font-size:11px;padding:8px"/>
      <button class="btn ghost block" data-save-url="${p.id}" style="margin-bottom:6px;padding:8px">Save link</button>
      <label class="btn ghost block" style="padding:8px;cursor:pointer">Upload
        <input type="file" accept="image/png,image/svg+xml,image/jpeg,image/webp,image/jpg" hidden data-up="${p.id}"/>
      </label>
    </div>`;
  }).join('');
  document.getElementById('root').innerHTML=`<div class="wrap">
    <div class="topbar"><div><div style="font-weight:700;font-size:18px">Icons</div>
    <div class="muted">Paste PNG/SVG/JPG URL or upload a file</div></div>
    <button class="btn ghost" id="logout">Logout</button></div>
    <div class="icon-grid">${cards}</div>
  </div>`;
  document.getElementById('logout').onclick=()=>{token='';sessionStorage.removeItem('admin_token');render()};
  document.querySelectorAll('[data-save-url]').forEach(btn=>{
    btn.onclick=async()=>{
      const id=btn.getAttribute('data-save-url');
      const url=document.querySelector(`[data-url="${id}"]`).value.trim();
      try{
        const j=await api('/api/admin/icon-link',{method:'POST',body:JSON.stringify({id,url})});
        iconsMap=j.icons||iconsMap; toast('Icon link saved',true); renderIcons();
      }catch(e){toast(e.message,false)}
    };
  });
  document.querySelectorAll('[data-up]').forEach(inp=>{
    inp.onchange=async()=>{
      const id=inp.getAttribute('data-up'); const file=inp.files&&inp.files[0]; if(!file)return;
      const dataUrl=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(file)});
      try{
        const j=await api('/api/admin/icon',{method:'POST',body:JSON.stringify({id,mime:file.type||'image/png',data:String(dataUrl).split(',')[1]||''})});
        iconsMap=j.icons||iconsMap; toast('Uploaded',true); renderIcons();
      }catch(e){toast(e.message,false)}
    };
  });
}

function renderDetail(){
  const p=PROVIDERS.find(x=>x.id===view.id);
  if(!p){view.page='list';return renderList()}
  document.getElementById('nav').style.display='flex';
  const accounts=parseAccounts(p);
  const rr=!!(connMap[p.id]&&connMap[p.id].roundRobin);
  const thinking=getThinking(p);
  const models=enabledModels(p);
  const connBlock=accounts.length?accounts.map((a,i)=>`<div class="conn"><div><div style="font-weight:600;font-size:13px">${a.name||('Key '+(i+1))}</div><code>${String(a.key||'').slice(0,8)}…</code></div>
    <button class="btn ghost" data-del-acc="${i}" style="padding:6px 10px">Remove</button></div>`).join('')
    :`<div class="empty">No connections yet</div>`;
  const modelBlock=models.map(m=>`<div class="model-chip"><span>${m}</span><button class="btn ghost" data-rm-model="${m}" style="padding:4px 8px">✕</button></div>`).join('');
  const suggested=(p.suggested||p.models||[]).filter(m=>!models.includes(m)).map(m=>`<button data-add-sug="${m}"><span>+</span> ${m}</button>`).join('');

  document.getElementById('root').innerHTML=`<div class="wrap">
    <button class="back" id="back">← Back</button>
    <div class="hdr"><div class="icon" style="background:${p.color||'#333'}">${icon(p)}</div>
      <div style="flex:1"><h1>${p.name}</h1><div class="sub">${accounts.length} connections · ${p.kind||'chat'}</div></div></div>
    <div class="info">${p.blurb||''}${p.site?`<div style="margin-top:8px"><a href="${p.site}" target="_blank" rel="noopener">${p.site}</a></div>`:''}</div>
    <div class="card">
      <div class="row" style="margin-bottom:12px"><h2 style="margin:0">Connections</h2>
        <div class="row"><span class="muted" style="font-size:12px">Round Robin</span>
        <button class="switch ${rr?'on':''}" id="rr" type="button"><i></i></button></div></div>
      ${connBlock}
      <button class="btn primary" id="addConn" style="margin-top:8px">+ Add Connection</button>
    </div>
    ${p.auth==='session'?`<div class="card"><h2>Session values</h2>
      ${(p.fields||[]).map(f=>`<div style="margin-bottom:10px"><label class="lbl">${f.label} · ${f.key}</label>
      ${f.area?`<textarea data-f="${f.key}" placeholder="${statusMap[f.key]?.preview||''}"></textarea>`:`<input data-f="${f.key}" type="password" placeholder="${statusMap[f.key]?.preview||''}"/>`}
      </div>`).join('')}
      <button class="btn blue block" id="saveSession">Save values</button>
    </div>`:''}
    <div class="card rel">
      <div class="row" style="margin-bottom:10px"><h2 style="margin:0">Available Models</h2>
        <button class="btn ghost" id="thinkBtn" style="padding:6px 10px">Thinking: ${thinking}</button></div>
      ${thinkOpen?`<div class="think-menu">${THINKING.map(t=>`<button data-think="${t}">Thinking: ${t}</button>`).join('')}</div>`:''}
      ${modelBlock||'<div class="muted">No models</div>'}
      <button class="btn ghost block" id="addModel" style="border-style:dashed;margin-top:8px">+ Add Model</button>
      <p class="muted" style="margin:12px 0 6px;font-size:12px">Suggested</p>
      <div class="suggest">${suggested||'<span class="muted">—</span>'}</div>
    </div>
    <div class="card"><h2>Test</h2><button class="btn blue block" id="test">Test connection</button>
      <pre id="testOut" class="muted" style="white-space:pre-wrap;font-family:var(--mono);font-size:11px;margin-top:10px"></pre></div>
  </div>${modal?renderModal(p):''}`;

  document.getElementById('back').onclick=()=>{view.page='list';render()};
  document.getElementById('rr').onclick=async()=>{await saveConn(p.id,{roundRobin:!rr,accounts:parseAccounts(p)});toast('Round robin updated',true);render()};
  document.getElementById('addConn').onclick=()=>{modal={mode:'single'};bulkMode=false;render()};
  document.getElementById('thinkBtn').onclick=()=>{thinkOpen=!thinkOpen;render()};
  document.querySelectorAll('[data-think]').forEach(b=>b.onclick=async()=>{await saveConn(p.id,{thinkingLevel:b.getAttribute('data-think'),accounts:parseAccounts(p)});thinkOpen=false;render()});
  document.querySelectorAll('[data-del-acc]').forEach(b=>b.onclick=async()=>{
    const next=parseAccounts(p).filter((_,i)=>i!==Number(b.getAttribute('data-del-acc')));
    if(p.auth==='apikey') await saveApiKeys(p,next); else await saveConn(p.id,{accounts:next});
    render();
  });
  document.querySelectorAll('[data-add-sug]').forEach(b=>b.onclick=async()=>{
    const m=b.getAttribute('data-add-sug');
    await saveConn(p.id,{enabledModels:Array.from(new Set([...enabledModels(p),m])),accounts:parseAccounts(p)});
    render();
  });
  document.querySelectorAll('[data-rm-model]').forEach(b=>b.onclick=async()=>{
    const m=b.getAttribute('data-rm-model');
    await saveConn(p.id,{enabledModels:enabledModels(p).filter(x=>x!==m),customModels:((connMap[p.id]||{}).customModels||[]).filter(x=>x!==m),accounts:parseAccounts(p)});
    render();
  });
  document.getElementById('addModel').onclick=async()=>{
    const m=prompt('Model id'); if(!m)return;
    const custom=Array.from(new Set([...((connMap[p.id]||{}).customModels||[]),m.trim()]));
    await saveConn(p.id,{customModels:custom,enabledModels:Array.from(new Set([...enabledModels(p),m.trim()])),accounts:parseAccounts(p)});
    render();
  };
  document.getElementById('test').onclick=async()=>{
    const out=document.getElementById('testOut'); out.textContent='Testing…';
    try{const j=await api('/api/admin/test',{method:'POST',body:JSON.stringify({provider:p.id,model:(models[0]||p.id)})});out.textContent=JSON.stringify(j,null,2);toast(j.ok?'OK':(j.error||'fail'),!!j.ok)}
    catch(e){out.textContent=e.message;toast(e.message,false)}
  };
  const ss=document.getElementById('saveSession');
  if(ss) ss.onclick=async()=>{
    const body={}; document.querySelectorAll('[data-f]').forEach(el=>{const v=el.value.trim();if(v)body[el.getAttribute('data-f')]=v});
    if(!Object.keys(body).length)return toast('Nothing to save',false);
    statusMap=await api('/api/admin/config',{method:'POST',body:JSON.stringify(body)});
    toast('Saved',true);render();
  };
  if(modal) wireModal(p, parseAccounts(p));
}

function renderModal(p){
  return `<div class="modal-bg" id="mbg"><div class="modal">
    <button class="x" id="mx">×</button>
    <h3>Add connection</h3>
    <div class="seg"><button class="${!bulkMode?'on':''}" id="tabSingle">Single</button><button class="${bulkMode?'on':''}" id="tabBulk">Bulk Add</button></div>
    ${bulkMode?`<p class="muted" style="font-size:12px">name|value per line</p><textarea id="bulk"></textarea>
      <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn ghost" id="mcancel">Cancel</button>
      <button class="btn primary" id="mbulk" style="width:auto">Add All</button></div>`
    :`<label class="lbl">Name</label><input id="cname" placeholder="Production"/>
      <label class="lbl" style="margin-top:10px">Value / API key / cookie</label><input id="ckey" type="password"/>
      <button class="btn primary" id="msave" style="margin-top:14px">Save</button>`}
  </div></div>`;
}
function wireModal(p,accounts){
  const close=()=>{modal=null;render()};
  document.getElementById('mx').onclick=close;
  document.getElementById('mbg').onclick=e=>{if(e.target.id==='mbg')close()};
  document.getElementById('tabSingle').onclick=()=>{bulkMode=false;render()};
  document.getElementById('tabBulk').onclick=()=>{bulkMode=true;render()};
  const c=document.getElementById('mcancel'); if(c)c.onclick=close;
  const save=document.getElementById('msave');
  if(save) save.onclick=async()=>{
    const name=document.getElementById('cname').value.trim()||'Key';
    const key=document.getElementById('ckey').value.trim();
    if(!key)return toast('Value required',false);
    const next=[...accounts,{name,key}];
    if(p.auth==='apikey') await saveApiKeys(p,next); else await saveConn(p.id,{accounts:next});
    modal=null; toast('Added',true); render();
  };
  const bulk=document.getElementById('mbulk');
  if(bulk) bulk.onclick=async()=>{
    const lines=document.getElementById('bulk').value.split('\n').map(s=>s.trim()).filter(Boolean);
    const add=lines.map((line,i)=>{const pipe=line.indexOf('|');return pipe>0?{name:line.slice(0,pipe).trim(),key:line.slice(pipe+1).trim()}:{name:'Key '+(accounts.length+i+1),key:line}});
    const next=[...accounts,...add];
    if(p.auth==='apikey') await saveApiKeys(p,next); else await saveConn(p.id,{accounts:next});
    modal=null; toast('Added '+add.length,true); render();
  };
}

function wireNav(){
  document.querySelectorAll('#nav [data-nav]').forEach(b=>{
    b.onclick=()=>{
      view.tab=b.getAttribute('data-nav');
      view.page=view.tab==='icons'?'icons':'list';
      view.id=null; filter=''; render();
    };
  });
}

async function render(){
  try{
    if(!token) return renderLogin();
    await load();
    wireNav();
    if(view.page==='icons'||view.tab==='icons') return renderIcons();
    if(view.page==='detail') return renderDetail();
    return renderList();
  }catch(e){
    console.error(e); toast(e.message||String(e),false);
    if(/unauthorized|ADMIN/i.test(String(e.message||''))){token='';sessionStorage.removeItem('admin_token');renderLogin()}
  }
}
render();
</script>
